<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..800;1,6..96,500..700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --room:#101315; --room-2:#15191c;
  --felt:#1b4a42; --felt-hi:#246156; --felt-lo:#11322c;
  --rail:#2a1e17; --rail-hi:#3b2a20;
  --brass:#d4af63; --brass-dim:#8f7644; --brass-ink:#1a1408;
  --ink:#ece5d4; --ink-2:#b0a896; --ink-3:#7c7668;
  --panel:#171b1e; --panel-2:#1f2428; --line:#2d3338;
  --paper:#f6f1e5; --paper-edge:#d8cfbb;
  --spade:#17191d; --heart:#b3261e; --diamond:#1d5ca6; --club:#2b774a;
  --good:#7cc88a; --warn:#e6b450; --bad:#e67661;
  --display:'Bodoni Moda','Bodoni 72','Didot',Georgia,serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--room);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
kbd{font-family:var(--mono);font-size:10px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.55;margin-left:6px}

.app{max-width:1340px;margin:0 auto;padding-inline:16px;padding-block:18px 32px;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(30px,4vw,44px);line-height:1;letter-spacing:-.01em}
.brand h1 em{color:var(--brass);font-weight:500}
.brand p{margin:6px 0 0;color:var(--ink-2);max-width:56ch;font-size:14px}
.kpis{display:flex;gap:6px 22px;flex-wrap:wrap;margin:0}
.kpis div{min-width:0}
.kpis dt{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.kpis dd{margin:2px 0 0;font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* ---------- table ---------- */
.table{position:relative;width:100%;aspect-ratio:16/9.4;margin-top:6px}
.felt{position:absolute;inset:8% 6% 11% 6%;border-radius:999px;
  background:repeating-linear-gradient(35deg,rgba(255,255,255,.014) 0 2px,transparent 2px 5px),radial-gradient(ellipse at 50% 40%,var(--felt-hi),var(--felt) 55%,var(--felt-lo));
  box-shadow:0 0 0 12px var(--rail),0 0 0 13px var(--rail-hi),0 0 0 14px rgba(212,175,99,.4),0 28px 70px rgba(0,0,0,.6),inset 0 0 70px rgba(0,0,0,.5)}
.felt::after{content:'';position:absolute;inset:16px;border-radius:inherit;border:1px solid rgba(212,175,99,.16)}
.felt-print{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);font-family:var(--display);font-style:italic;font-size:13px;color:rgba(212,175,99,.34);white-space:nowrap;letter-spacing:.04em}
.center{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:9px;z-index:1;width:60%}
.street{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(236,229,212,.55)}
.board{display:flex;gap:6px}
.slot{--w:50px;width:var(--w);aspect-ratio:5/7;border-radius:6px;border:1px dashed rgba(236,229,212,.14)}
.pot{font-family:var(--mono);font-size:14px;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.28);padding:3px 12px 3px 5px;border-radius:999px;font-variant-numeric:tabular-nums}
.pot:empty{display:none}
.banner{font-size:13.5px;text-align:center;color:var(--ink);background:rgba(10,12,13,.78);border:1px solid rgba(212,175,99,.45);padding:6px 12px;border-radius:10px;max-width:100%;text-wrap:balance}
.banner b{color:var(--brass)}

.chip{width:15px;height:15px;border-radius:50%;background:var(--brass);box-shadow:inset 0 0 0 2px var(--brass),inset 0 0 0 3.5px #fff6,inset 0 0 0 5px var(--brass);flex:none}

.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;width:132px;z-index:2}
.seat .hole{display:flex;gap:3px;min-height:44px;align-items:flex-end}
.plate{display:flex;align-items:center;gap:8px;width:100%;background:rgba(14,17,19,.94);border:1px solid var(--line);border-radius:12px;padding:5px 9px 5px 5px;transition:border-color .2s,box-shadow .2s}
.seat.active .plate{border-color:var(--brass);box-shadow:0 0 0 3px rgba(212,175,99,.2)}
.seat.folded{opacity:.45}
.seat.winner .plate{border-color:var(--good);box-shadow:0 0 0 3px rgba(124,200,138,.25)}
.sigil{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:700;font-size:16px;color:#101315;background:var(--c,#ccc)}
.who{min-width:0;flex:1}
.who b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.who .ps{font-family:var(--body);font-style:normal;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--brass)}
.sd:empty{display:none}
.bubble{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink-2);min-height:15px;white-space:nowrap}
.bubble.hot{color:var(--brass)}
.bubble.win{color:var(--good)}
.showname{font-size:11px;color:var(--ink);background:rgba(0,0,0,.45);padding:1px 7px;border-radius:6px;white-space:nowrap}
.dots{display:inline-flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--brass);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.seat.hero{width:176px}
.seat.hero .plate{padding:6px 12px 6px 6px}
.seat.hero .hole{min-height:70px}

.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.34);padding:2px 9px 2px 3px;border-radius:999px;z-index:1;font-variant-numeric:tabular-nums}
.dbtn{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--paper);color:#15181a;font:700 11px var(--body);display:grid;place-items:center;box-shadow:0 2px 5px rgba(0,0,0,.5);z-index:1;transition:left .4s,top .4s}

/* seat positions: 0 = you, then clockwise */
.s0{left:50%;top:90%} .s1{left:9%;top:64%} .s2{left:23%;top:11%} .s3{left:77%;top:11%} .s4{left:91%;top:64%}

/* ---------- cards ---------- */
.card{--w:44px;width:var(--w);aspect-ratio:5/7;border-radius:calc(var(--w)*.12);background:var(--paper);box-shadow:inset 0 -2px 0 var(--paper-edge),0 3px 8px rgba(0,0,0,.45);position:relative;color:var(--sc);font-family:var(--display);flex:none;animation:deal .28s ease-out}
.card .r{position:absolute;left:11%;top:3%;font-weight:700;font-size:calc(var(--w)*.42);line-height:1.05;letter-spacing:-.04em}
.card .s{position:absolute;right:9%;bottom:3%;font-size:calc(var(--w)*.52);line-height:1;font-family:'Segoe UI Symbol','Apple Symbols',var(--body)}
.card.sp{--sc:var(--spade)} .card.he{--sc:var(--heart)} .card.di{--sc:var(--diamond)} .card.cl{--sc:var(--club)}
.card.back{background:radial-gradient(circle at 50% 50%,transparent 32%,rgba(212,175,99,.25) 33%,transparent 35%),repeating-linear-gradient(45deg,#5b1e25 0 3px,#6d272e 3px 6px);box-shadow:inset 0 0 0 2px var(--paper),0 3px 8px rgba(0,0,0,.45)}
.card.dim{filter:brightness(.55) saturate(.6)}
.card.lift{transform:translateY(-6px);box-shadow:0 0 0 2px var(--good),0 6px 14px rgba(0,0,0,.5)}
.card.sm{--w:30px}
.card.lg{--w:52px}
.card.xl{--w:56px}
@keyframes deal{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}

/* ---------- action bar ---------- */
.play{min-width:0}
.alert{margin-top:14px;padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.alert.leak{background:rgba(230,118,97,.09);border-color:rgba(230,118,97,.45)}
.alert.good{background:rgba(124,200,138,.08);border-color:rgba(124,200,138,.4)}
.alert.ok{background:rgba(230,180,80,.08);border-color:rgba(230,180,80,.4)}
.alert .tag{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding-top:2px;white-space:nowrap}
.alert.tip{background:rgba(212,175,99,.08);border-color:rgba(212,175,99,.5)}
.alert.tip .tag{color:var(--brass)}
.alert a{color:var(--brass);white-space:nowrap}
.stat small{color:var(--ink-3);font-weight:500;font-size:12px;font-family:var(--body)}
.alert.leak .tag{color:var(--bad)} .alert.good .tag{color:var(--good)} .alert.ok .tag{color:var(--warn)}
.actions{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.act-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.status{font-size:14px;color:var(--ink-2)}
.status b{color:var(--ink);font-weight:600}
.btn{font:600 15px var(--body);border-radius:11px;padding:12px 16px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;transition:transform .08s,filter .15s,opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-variant-numeric:tabular-nums}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.call{background:#e8e1ce;color:#15181a;border-color:#e8e1ce}
.btn.raise{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.fold{color:var(--bad)}
.btn.coachb{background:transparent;border-color:var(--brass-dim);color:var(--brass);padding:9px 14px;font-size:14px}
.btn.coachb svg{width:17px;height:17px;margin-right:4px}
.act-btns{display:grid;grid-template-columns:1fr 1.3fr 1.5fr;gap:10px}
.act-btns .btn{min-height:50px}
.sizer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{font:500 12.5px var(--body);padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
.preset:hover:not(:disabled){color:var(--ink);border-color:var(--brass-dim)}
.preset:disabled{opacity:.35;cursor:not-allowed}
.sizer input[type=range]{flex:1 1 140px;accent-color:var(--brass);min-width:0}
.sizer input[type=number]{width:88px;background:var(--room-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 8px;font:500 14px var(--mono)}
.sizer.off{opacity:.35;pointer-events:none}

/* ---------- coach panel ---------- */
.coach{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:sticky;top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;max-height:calc(100vh - 28px)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;padding:13px 8px;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.pane{padding:18px;overflow:auto;flex:1;min-height:0}
.coach-foot{flex:none;border-top:1px solid var(--line);padding:10px 18px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2)}
.coach-foot label{display:flex;align-items:center;gap:7px;cursor:pointer}
.coach-foot input{accent-color:var(--brass)}

.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 6px}
.h2{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.muted{color:var(--ink-2);font-size:14px;margin:0}
.stack{display:grid;gap:18px}
.roster{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.roster li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.roster b{font-weight:600}
.roster .tagline{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-left:6px}
.roster p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.roster p em{color:var(--ink);font-style:normal}

.tip.stale{opacity:.5}
.stale-note{font-size:12.5px;color:var(--warn);margin:0 0 10px}
.verdict{font-family:var(--display);font-weight:700;font-size:36px;line-height:1.02;margin:0;letter-spacing:-.005em}
.verdict.go{color:var(--good)} .verdict.caution{color:var(--warn)} .verdict.stop{color:var(--bad)}
.summary{margin:8px 0 0;font-size:15px;text-wrap:pretty}
.meter{margin-top:4px}
.meter-bar{position:relative;height:12px;border-radius:999px;background:var(--panel-2);overflow:visible}
.meter-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--brass-dim),var(--brass))}
.meter-need{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px}
.meter-legend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:7px;gap:10px}
.meter-legend b{color:var(--ink);font-weight:500}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--panel-2);border-radius:10px;padding:8px 11px;min-width:0}
.stat .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-size:14.5px;font-weight:600;margin-top:1px}
.stat .v.num{font-family:var(--mono);font-weight:500;font-size:17px}
.reasons{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.reasons li{position:relative;padding-left:18px;font-size:14px;color:var(--ink);text-wrap:pretty}
.reasons li::before{content:'';position:absolute;left:3px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--brass)}
.reads{display:grid;gap:12px}
.read{display:grid;grid-template-columns:30px 1fr;gap:10px}
.read b{font-weight:600;font-size:14px}
.read p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2);text-wrap:pretty}
.read .w{font-family:var(--mono);font-size:11.5px;color:var(--brass);margin-left:6px}
.lesson{border:1px solid rgba(212,175,99,.32);background:rgba(212,175,99,.06);border-radius:14px;padding:14px 16px}
.lesson h3{font-family:var(--display);font-style:italic;font-weight:600;font-size:21px;margin:0 0 6px;color:var(--brass)}
.lesson p{margin:0;font-size:14px;color:var(--ink);text-wrap:pretty}

.chart-pos{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.chart-pos button{font:600 12px var(--body);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
.chart-pos button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.grid13{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;font-family:var(--mono);font-size:9.5px}
.grid13 div{aspect-ratio:1;display:grid;place-items:center;border-radius:3px;background:var(--panel-2);color:var(--ink-3);letter-spacing:-.04em}
.grid13 div.in{background:rgba(212,175,99,var(--a,.8));color:var(--brass-ink);font-weight:600}
.grid13 div.me{outline:2px solid var(--ink);outline-offset:-1px;position:relative;z-index:1}
.chart-key{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.chart-key span{display:inline-flex;align-items:center;gap:6px}
.chart-key i{width:12px;height:12px;border-radius:3px;display:inline-block}

.log{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:13px}
.log li{color:var(--ink-2);text-wrap:pretty}
.log li.hand{color:var(--brass);font-family:var(--display);font-style:italic;font-size:15px;margin-top:10px}
.log li.street{color:var(--ink);font-weight:600;font-size:12px;letter-spacing:.06em}
.log li.win{color:var(--good)}
.log li.leak{color:var(--bad)}
.log li.me{color:var(--ink)}

/* ---------- responsive ---------- */
@media (max-width:1060px){
  .app{grid-template-columns:minmax(0,1fr)}
  .coach{position:static;max-height:none}
  .pane{overflow:visible}
}
@media (max-width:640px){
  .table{aspect-ratio:4/5}
  .felt{inset:9% 7% 13% 7%;border-radius:46%/34%}
  .felt-print{bottom:12%;font-size:11px}
  .center{top:46%;width:86%}
  .slot,.board .card{--w:40px}
  .board{gap:4px}
  .seat{width:98px}
  .seat.hero{width:150px}
  .plate{padding:4px 6px 4px 4px;gap:6px}
  .sigil{width:24px;height:24px;font-size:13px}
  .who b{font-size:11.5px}
  .who span{font-size:11px}
  .seat .card.sm{--w:25px}
  .seat .hole{min-height:36px}
  .seat.hero .card.xl{--w:48px}
  .seat.hero .hole{min-height:68px}
  .s0{top:89%} .s1{left:15%;top:67%} .s2{left:18%;top:17%} .s3{left:82%;top:17%} .s4{left:85%;top:67%}
  .act-btns{grid-template-columns:1fr 1fr}
  .act-btns #bRaise{grid-column:1/-1}
  .kpis{gap:4px 16px}
  .kpis dd{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Pocket <em>Coach</em></h1>
      <p>No-limit Hold'em against four bots, each with a different style. Play your hands and ask the coach whenever you're not sure what to do.</p>
    </div>
    <dl class="kpis">
      <div><dt>Hand</dt><dd id="kHand">—</dd></div>
      <div><dt>Your stack</dt><dd id="kStack">2,000</dd></div>
      <div><dt>Net</dt><dd id="kNet">0</dd></div>
      <div><dt>Coach agreement</dt><dd id="kAgree">—</dd></div>
    </dl>
  </header>

  <main class="play">
    <div class="table" id="table">
      <div class="felt"><div class="felt-print">No-Limit Hold'em · Blinds 10 / 20</div></div>
      <div class="center">
        <div class="street" id="street">Preflop</div>
        <div class="board" id="board"></div>
        <div class="pot" id="pot"></div>
        <div class="banner" id="banner" hidden></div>
      </div>
    </div>

    <div class="alert" id="alert" hidden></div>

    <section class="actions" id="actions" aria-label="Your actions">
      <div class="act-top">
        <div class="status" id="status">Shuffling up…</div>
        <button class="btn coachb" id="bTip" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg>
          Ask the coach<kbd>T</kbd>
        </button>
      </div>
      <div class="sizer" id="sizer">
        <div class="presets" id="presets"></div>
        <input type="range" id="rAmt" min="0" max="100" step="5" value="0" aria-label="Bet size">
        <input type="number" id="nAmt" min="0" step="5" value="0" aria-label="Bet size in chips">
      </div>
      <div class="act-btns" id="actBtns">
        <button class="btn fold" id="bFold" type="button">Fold<kbd>F</kbd></button>
        <button class="btn call" id="bCall" type="button">Check<kbd>C</kbd></button>
        <button class="btn raise" id="bRaise" type="button">Raise<kbd>R</kbd></button>

    </section>

  <aside class="coach" id="coach" aria-label="Coach">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tCoach" aria-selected="true" aria-controls="paneCoach" type="button">Coach</button>
      <button class="tab" role="tab" id="tChart" aria-selected="false" aria-controls="paneChart" type="button">Hand chart</button>
      <button class="tab" role="tab" id="tLog" aria-selected="false" aria-controls="paneLog" type="button">History</button>
    </div>

    <footer class="coach-foot">
      <label><input type="checkbox" id="optAlerts" checked> Review my decisions as I play</label>
      <label><input type="checkbox" id="optFast"> Fast bots</label>
    </footer>
  </aside>
</div>
<script>
'use strict';
/* ================= Cards & hand evaluation ================= */
// A card is an int 0..51: rank = c>>2 (0 = deuce … 12 = ace), suit = c&3 (♠ ♥ ♦ ♣)
const RANKS = '23456789TJQKA';
const SUIT_SYM = ['♠︎', '♥︎', '♦︎', '♣︎'];
const SUIT_CLASS = ['sp', 'he', 'di', 'cl'];
const SUIT_WORD = ['spades', 'hearts', 'diamonds', 'clubs'];
const RANK_NAME = ['Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Jack','Queen','King','Ace'];
const RANK_PL = ['Twos','Threes','Fours','Fives','Sixes','Sevens','Eights','Nines','Tens','Jacks','Queens','Kings','Aces'];
const rankOf = c => c >> 2;
const suitOf = c => c & 3;
const rankLabel = r => (r === 8 ? '10' : RANKS[r]);
const cardText = c => rankLabel(rankOf(c)) + SUIT_SYM[suitOf(c)];

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function freshDeck() { const d = []; for (let i = 0; i < 52; i++) d.push(i); return shuffle(d); }
function remainingDeck(exclude) {
  const used = new Uint8Array(52); for (const c of exclude) used[c] = 1;
  const d = []; for (let i = 0; i < 52; i++) if (!used[i]) d.push(i); return d;
}

function straightHigh(mask) {
  for (let h = 12; h >= 4; h--) { const m = 0x1f << (h - 4); if ((mask & m) === m) return h; }
  if ((mask & 0x100f) === 0x100f) return 3; // wheel A-2-3-4-5
  return -1;
}

const CAT_BASE = 1048576; // 16^5
const catOf = v => Math.floor(v / CAT_BASE);
const CAT_NAME = ['High card','Pair','Two pair','Three of a kind','Straight','Flush','Full house','Four of a kind','Straight flush'];
function pack(cat, ks) { let v = cat; for (let i = 0; i < 5; i++) v = v * 16 + (ks[i] ?? 0); return v; }
function kickersOf(v) { const k = []; let t = v % CAT_BASE; for (let i = 0; i < 5; i++) { k.unshift(t % 16); t = Math.floor(t / 16); } return k; }

// Best 5-card value from any 1–7 cards; higher is better.
function evaluate(cards) {
  const rc = new Array(13).fill(0), sc = [0, 0, 0, 0], sm = [0, 0, 0, 0];
  let mask = 0;
  for (const c of cards) { const r = c >> 2, s = c & 3; rc[r]++; sc[s]++; sm[s] |= 1 << r; mask |= 1 << r; }
  let fs = -1; for (let s = 0; s < 4; s++) if (sc[s] >= 5) fs = s;
  if (fs >= 0) { const h = straightHigh(sm[fs]); if (h >= 0) return pack(8, [h]); }
  const quads = [], trips = [], pairs = [];
  for (let r = 12; r >= 0; r--) { if (rc[r] === 4) quads.push(r); else if (rc[r] === 3) trips.push(r); else if (rc[r] === 2) pairs.push(r); }
  const kick = (ex, n) => { const out = []; for (let r = 12; r >= 0 && out.length < n; r--) if (rc[r] && !ex.includes(r)) out.push(r); return out; };
  if (quads.length) return pack(7, [quads[0], ...kick([quads[0]], 1)]);
  if (trips.length && (trips.length > 1 || pairs.length)) {
    const p = trips.length > 1 ? Math.max(trips[1], pairs.length ? pairs[0] : -1) : pairs[0];
    return pack(6, [trips[0], p]);
  }
  if (fs >= 0) { const out = []; for (let r = 12; r >= 0 && out.length < 5; r--) if ((sm[fs] >> r) & 1) out.push(r); return pack(5, out); }
  const sh = straightHigh(mask); if (sh >= 0) return pack(4, [sh]);
  if (trips.length) return pack(3, [trips[0], ...kick([trips[0]], 2)]);
  if (pairs.length >= 2) return pack(2, [pairs[0], pairs[1], ...kick([pairs[0], pairs[1]], 1)]);
  if (pairs.length) return pack(1, [pairs[0], ...kick([pairs[0]], 3)]);
  return pack(0, kick([], 5));
}

function describe(v) {
  const k = kickersOf(v);
  switch (catOf(v)) {
    case 8: return k[0] === 12 ? 'Royal flush' : `Straight flush, ${RANK_NAME[k[0]]} high`;
    case 7: return `Four ${RANK_PL[k[0]]}`;
    case 6: return `Full house, ${RANK_PL[k[0]]} full of ${RANK_PL[k[1]]}`;
    case 5: return `Flush, ${RANK_NAME[k[0]]} high`;
    case 4: return `Straight, ${RANK_NAME[k[0]]} high`;
    case 3: return `Three ${RANK_PL[k[0]]}`;
    case 2: return `Two pair, ${RANK_PL[k[0]]} and ${RANK_PL[k[1]]}`;
    case 1: return `Pair of ${RANK_PL[k[0]]}`;
    default: return `${RANK_NAME[k[0]]} high`;
  }
}

/* ================= Preflop hand ranking ================= */
// Chen-formula score (unrounded) with a small high-card tiebreak orders the 169 starting hands.
function chenScore(hi, lo, suited) {
  const pts = r => (r === 12 ? 10 : r === 11 ? 8 : r === 10 ? 7 : r === 9 ? 6 : (r + 2) / 2);
  if (hi === lo) return Math.max(5, pts(hi) * 2);
  let s = pts(hi) + (suited ? 2 : 0);
  const gap = hi - lo - 1;
  s -= [0, 1, 2, 4][gap] ?? 5;
  if (gap <= 1 && hi < 10) s += 1;
  return s;
}
function classKey(hi, lo, suited) { return hi === lo ? RANKS[hi] + RANKS[lo] : RANKS[hi] + RANKS[lo] + (suited ? 's' : 'o'); }
function handClass(c1, c2) {
  let a = rankOf(c1), b = rankOf(c2); if (b > a) [a, b] = [b, a];
  return classKey(a, b, suitOf(c1) === suitOf(c2));
}
const PRE = {};           // class -> { pct: fraction of all hands at least this good, order }
const COMBOS = [];        // all 1326 two-card combos, strongest first
(function buildPreflop() {
  const list = [];
  for (let a = 12; a >= 0; a--) for (let b = a; b >= 0; b--) {
    if (a === b) list.push({ hi: a, lo: b, s: false, n: 6 });
    else { list.push({ hi: a, lo: b, s: true, n: 4 }); list.push({ hi: a, lo: b, s: false, n: 12 }); }
  }
  for (const h of list) { h.k = classKey(h.hi, h.lo, h.s); h.score = chenScore(h.hi, h.lo, h.s) + (h.hi + h.lo) / 100 + (h.hi === h.lo ? 0.05 : 0); }
  list.sort((x, y) => y.score - x.score);
  let cum = 0;
  list.forEach((h, i) => {
    cum += h.n; PRE[h.k] = { pct: cum / 1326, order: i + 1 };
    for (let s1 = 0; s1 < 4; s1++) for (let s2 = 0; s2 < 4; s2++) {
      const c1 = h.hi * 4 + s1, c2 = h.lo * 4 + s2;
      if (h.hi === h.lo) { if (s2 > s1) COMBOS.push([c1, c2]); }
      else if (h.s ? s1 === s2 : s1 !== s2) COMBOS.push([c1, c2]);
    }
  });
})();
const prePct = (c1, c2) => PRE[handClass(c1, c2)].pct;

/* ================= Draws, outs, board texture ================= */
function drawInfo(hole, board) {
  const all = hole.concat(board);
  const sc = [0, 0, 0, 0], hs = [0, 0, 0, 0];
  for (const c of all) sc[suitOf(c)]++;
  for (const c of hole) hs[suitOf(c)]++;
  let flushDraw = false, fdSuit = -1;
  if (board.length < 5) for (let s = 0; s < 4; s++) if (sc[s] === 4 && hs[s] > 0) { flushDraw = true; fdSuit = s; }
  let mask = 0, bmask = 0;
  for (const c of all) mask |= 1 << rankOf(c);
  for (const c of board) bmask |= 1 << rankOf(c);
  const straightRanks = [];
  if (board.length < 5 && straightHigh(mask) < 0) {
    for (let r = 0; r < 13; r++) {
      if ((mask >> r) & 1) continue;
      if (straightHigh(mask | (1 << r)) >= 0 && straightHigh(bmask | (1 << r)) < 0) straightRanks.push(r);
    }
  }
  return { flushDraw, fdSuit, oesd: straightRanks.length >= 2, gutshot: straightRanks.length === 1, straightRanks };
}

// Cards that turn hero's hand into a straight or better (using a hole card).
function countOuts(hole, board) {
  if (board.length >= 5) return { outs: 0, pairOuts: 0 };
  const cur = catOf(evaluate(hole.concat(board)));
  let outs = 0, pairOuts = 0;
  const topBoard = Math.max(...board.map(rankOf));
  for (const c of remainingDeck(hole.concat(board))) {
    const nc = catOf(evaluate(hole.concat(board, [c])));
    const bc = catOf(evaluate(board.concat([c])));
    if (nc >= 4 && cur < 4 && nc > bc) outs++;
    else if (cur === 0 && nc === 1 && bc === 0 && rankOf(c) > topBoard && hole.some(h => rankOf(h) === rankOf(c))) pairOuts++;
  }
  return { outs, pairOuts };
}

function boardTexture(board) {
  const sc = [0, 0, 0, 0]; board.forEach(c => sc[suitOf(c)]++);
  const maxS = Math.max(...sc);
  const rs = board.map(rankOf);
  const paired = new Set(rs).size < rs.length;
  let mask = 0; rs.forEach(r => (mask |= 1 << r));
  let conn = 0;
  for (let lo = -1; lo <= 8; lo++) {
    let n = 0; for (let r = lo; r < lo + 5; r++) { const rr = r === -1 ? 12 : r; if ((mask >> rr) & 1) n++; }
    conn = Math.max(conn, n);
  }
  const flushy = maxS >= 3;
  const wet = flushy || conn >= 3 || (maxS === 2 && board.length === 3 && conn >= 2);
  const bits = [];
  if (board.length === 3) bits.push(maxS === 3 ? 'monotone' : maxS === 2 ? 'two-tone' : 'rainbow');
  else if (flushy) bits.push('flush possible');
  if (paired) bits.push('paired');
  if (conn >= 3) bits.push('connected');
  return { wet, flushy, paired, conn, maxS, desc: bits.join(', ') };
}

/* ================= Equity (Monte Carlo) ================= */
// Does this hole hand interact with the board (made hand using a hole card, or a real draw)?
function connects(h, board) {
  if (catOf(evaluate(h.concat(board))) > catOf(evaluate(board))) return true;
  if (board.length < 5) { const d = drawInfo(h, board); if (d.flushDraw || d.oesd) return true; }
  return false;
}

// opps: array of null (any two cards) or { width, cond, loose } describing a likely range.
function equity(hero, board, opps, iters = 1000) {
  const dead = new Uint8Array(52);
  for (const c of hero) dead[c] = 1;
  for (const c of board) dead[c] = 1;
  const used = new Uint8Array(52);
  let score = 0;
  const heroFixed = hero.slice();
  for (let it = 0; it < iters; it++) {
    used.set(dead);
    const holes = [];
    for (const o of opps) {
      const lim = Math.max(6, Math.min(1326, Math.round((o ? o.width : 1) * 1326)));
      let h = null;
      for (let t = 0; t < 60; t++) {
        const cb = COMBOS[(Math.random() * lim) | 0];
        if (used[cb[0]] || used[cb[1]]) continue;
        h = cb;
        if (o && o.cond && board.length >= 3 && t < 45 && Math.random() > o.loose && !connects(cb, board)) continue;
        break;
      }
      if (!h) {
        let a, b;
        do { a = (Math.random() * 52) | 0; } while (used[a]);
        used[a] = 1;
        do { b = (Math.random() * 52) | 0; } while (used[b]);
        used[a] = 0; h = [a, b];
      }
      used[h[0]] = 1; used[h[1]] = 1; holes.push(h);
    }
    const run = board.slice();
    while (run.length < 5) { const c = (Math.random() * 52) | 0; if (!used[c]) { used[c] = 1; run.push(c); } }
    const hv = evaluate(heroFixed.concat(run));
    let mx = hv; const vs = [];
    for (const h of holes) { const v = evaluate(h.concat(run)); vs.push(v); if (v > mx) mx = v; }
    if (hv === mx) { let n = 1; for (const v of vs) if (v === mx) n++; score += 1 / n; }
  }
  return score / iters;
}
/* ================= Table & game flow ================= */
const SB = 10, BB = 20, START_STACK = 2000, N = 5;
const STREETS = ['Preflop', 'Flop', 'Turn', 'River'];

// vpip: how often they put money in preflop; pfr: how often they raise; threeBet: re-raise;
// agg: how often they bet their good hands; bluff: bet/raise with nothing; sticky: how loosely they call; float: call postflop without a hand
const PERSONAS = {
  rock:    { name: 'The Rock',    sigil: 'R', color: '#9bb1bf', tag: 'Tight · passive',   vpip: .15, pfr: .09, threeBet: .03, agg: .35, bluff: .05, sticky: -.04, float: .12,
             blurb: 'Plays very few hands and almost never bluffs.', beat: 'Steal their blinds and fold when they suddenly bet big.' },
  maniac:  { name: 'The Maniac',  sigil: 'M', color: '#e3806b', tag: 'Loose · aggressive', vpip: .55, pfr: .38, threeBet: .14, agg: .85, bluff: .42, sticky: .05, float: .45,
             blurb: 'Raises constantly, often with weak hands.', beat: 'Call down lighter with good hands and let them bluff into you.' },
  station: { name: 'The Station', sigil: 'S', color: '#8fc59a', tag: 'Loose · passive',   vpip: .52, pfr: .06, threeBet: .02, agg: .2,  bluff: .06, sticky: .22, float: .65,
             blurb: 'Calls almost everything and rarely raises.', beat: 'Never bluff them. Bet your good hands big, because they will pay.' },
  shark:   { name: 'The Shark',   sigil: 'K', color: '#d4af63', tag: 'Tight · aggressive', vpip: .24, pfr: .18, threeBet: .07, agg: .62, bluff: .22, sticky: .02, float: .25,
             blurb: 'A solid player: selective preflop, aggressive after.', beat: 'Respect their re-raises and avoid big pots without a big hand.' },
};

const G = {
  players: [], dealer: 0, handNo: 0, board: [], deck: [], street: 0, pot: 0,
  currentBet: 0, minRaise: BB, toAct: -1, raiseCount: 0, lastAggressor: -1, preflopRaiser: -1,
  over: true, waitingHuman: false, thinking: -1, result: null, log: [], decisionId: 0,
  stats: { decisions: 0, agreed: 0, leaks: 0 }, fast: false,
};

function makePlayers() {
  const seats = [{ human: true, name: 'You' }, { persona: 'rock' }, { persona: 'maniac' }, { persona: 'station' }, { persona: 'shark' }];
  G.players = seats.map((s, i) => ({
    id: i, human: !!s.human, persona: s.persona || null,
    name: s.human ? 'You' : PERSONAS[s.persona].name,
    stack: START_STACK, buyins: 1, hole: [], bet: 0, total: 0, folded: false, allIn: false,
    acted: false, lastAction: '', actions: [], shown: false, won: 0, value: 0, handDesc: '',
  }));
}

const fmt = n => Math.round(n).toLocaleString('en-US');
const canAct = p => !p.folded && !p.allIn;
const potNow = () => G.pot + G.players.reduce((s, p) => s + p.bet, 0);
const liveOpponents = () => G.players.filter(p => !p.human && !p.folded);
function positionOf(seat) { return ['BTN', 'SB', 'BB', 'UTG', 'CO'][(seat - G.dealer + N) % N]; }
function nextActor(from) {
  for (let k = 1; k <= N; k++) { const i = (from + k) % N; if (canAct(G.players[i])) return i; }
  return -1;
}
function log(text, kind = '') {
  G.log.push({ text, kind, hand: G.handNo });
  if (G.log.length > 400) G.log.splice(0, G.log.length - 400);
}
function post(p, amt) {
  const a = Math.max(0, Math.min(amt, p.stack));
  p.stack -= a; p.bet += a; p.total += a;
  if (p.stack === 0) p.allIn = true;
  return a;
}
function later(fn, ms) { setTimeout(fn, G.fast ? Math.min(ms, 160) : ms); }

function startHand() {
  G.handNo++; G.decisionId++;
  G.over = false; G.board = []; G.pot = 0; G.street = 0; G.raiseCount = 0; G.result = null;
  G.lastAggressor = -1; G.preflopRaiser = -1; G.waitingHuman = false; G.thinking = -1;
  log(`Hand ${G.handNo}`, 'hand');
  for (const p of G.players) {
    if (p.stack <= 0) { p.stack = START_STACK; p.buyins++; log(`${p.name} ${p.human ? 'reload' : 'reloads'} to ${fmt(START_STACK)}.`); }
    Object.assign(p, { hole: [], bet: 0, total: 0, folded: false, allIn: false, acted: false, lastAction: '', actions: [], shown: false, won: 0, value: 0, handDesc: '' });
  }
  G.dealer = (G.dealer + 1) % N;
  G.deck = freshDeck();
  const sb = G.players[(G.dealer + 1) % N], bb = G.players[(G.dealer + 2) % N];
  post(sb, SB); sb.lastAction = 'Small blind';
  post(bb, BB); bb.lastAction = 'Big blind';
  for (let r = 0; r < 2; r++) for (let k = 1; k <= N; k++) G.players[(G.dealer + k) % N].hole.push(G.deck.pop());
  G.currentBet = BB; G.minRaise = BB;
  G.toAct = nextActor((G.dealer + 2) % N);
  log(`You are on ${POS_LONG[positionOf(0)]} with ${G.players[0].hole.map(cardText).join(' ')}.`, 'me');
  render();
  later(step, 500);
}

function step() {
  if (G.over) return;
  const live = G.players.filter(p => !p.folded);
  if (live.length === 1) return winUncontested(live[0]);
  if (roundComplete()) return endStreet();
  const p = G.players[G.toAct];
  if (!p || !canAct(p)) { G.toAct = nextActor(G.toAct); return step(); }
  if (p.human) { G.waitingHuman = true; G.decisionId++; render(); onHumanTurn(); return; }
  G.thinking = p.id; render();
  later(() => {
    G.thinking = -1;
    const d = decideBot(p);
    act(p, d.type, d.amount);
  }, 650 + Math.random() * 500);
}

function roundComplete() {
  const actors = G.players.filter(canAct);
  if (actors.every(p => p.acted && p.bet >= G.currentBet)) return true;
  // Everyone else is all-in and the last player has matched: nothing left to decide.
  if (actors.length === 1 && actors[0].bet >= G.currentBet && G.players.filter(p => !p.folded).length > 1) return true;
  return false;
}

function act(p, type, amount = 0) {
  if (G.over) return;
  G.waitingHuman = false;
  const toCall = G.currentBet - p.bet;
  if ((type === 'bet' || type === 'raise') && Math.min(amount, p.bet + p.stack) <= G.currentBet) type = 'call';
  if (type === 'call' && toCall <= 0) type = 'check';
  if (type === 'check' && toCall > 0) type = 'fold';
  let label = '', rec = type;
  if (type === 'fold') { p.folded = true; label = 'Fold'; }
  else if (type === 'check') { label = 'Check'; }
  else if (type === 'call') { const a = post(p, toCall); label = p.allIn ? `All-in ${fmt(p.bet)}` : `Call ${fmt(a)}`; }
  else {
    const to = Math.min(Math.max(amount, G.currentBet + G.minRaise), p.bet + p.stack);
    const prev = G.currentBet;
    post(p, to - p.bet);
    const inc = p.bet - prev;
    if (inc >= G.minRaise) { G.minRaise = inc; for (const o of G.players) if (o !== p) o.acted = false; }
    else for (const o of G.players) if (o !== p && o.bet < p.bet) o.acted = false;
    G.currentBet = p.bet; G.raiseCount++; G.lastAggressor = p.id;
    if (G.street === 0) G.preflopRaiser = p.id;
    rec = 'raise';
    label = p.allIn ? `All-in ${fmt(p.bet)}` : (prev === 0 ? `Bet ${fmt(p.bet)}` : `Raise to ${fmt(p.bet)}`);
  }
  p.acted = true; p.lastAction = label;
  p.actions.push({ street: G.street, type: rec, to: p.bet, level: rec === 'raise' ? G.raiseCount : 0, facing: toCall });
  log(`${p.name}: ${label.toLowerCase()}`, p.human ? 'me' : '');
  G.toAct = nextActor(p.id);
  render();
  later(step, 280);
}

function collectBets() {
  for (const p of G.players) { G.pot += p.bet; p.bet = 0; p.acted = false; if (!p.folded && !p.allIn) p.lastAction = ''; }
  G.currentBet = 0; G.minRaise = BB; G.raiseCount = 0;
}

function endStreet() {
  collectBets();
  if (G.street === 3) return showdown();
  G.street++;
  const n = G.street === 1 ? 3 : 1;
  G.deck.pop(); // burn
  for (let i = 0; i < n; i++) G.board.push(G.deck.pop());
  log(`${STREETS[G.street]}: ${G.board.map(cardText).join(' ')}  (pot ${fmt(G.pot)})`, 'street');
  G.decisionId++;
  const actors = G.players.filter(canAct);
  if (actors.length <= 1) {
    // No more betting possible: turn the cards face up and run out the board.
    G.players.forEach(p => { if (!p.folded) p.shown = true; });
    G.toAct = -1; render();
    later(endStreet, 1100);
    return;
  }
  G.toAct = nextActor(G.dealer);
  render();
  later(step, 550);
}

function winUncontested(w) {
  collectBets();
  w.stack += G.pot; w.won = G.pot;
  G.result = { winners: [w], text: `${w.name} ${w.human ? 'win' : 'wins'} ${fmt(G.pot)}. Everyone else folded.` };
  log(`${w.name} ${w.human ? 'take' : 'takes'} the pot of ${fmt(G.pot)} uncontested.`, 'win');
  finishHand();
}

function showdown() {
  const live = G.players.filter(p => !p.folded);
  for (const p of live) { p.shown = true; p.value = evaluate(p.hole.concat(G.board)); p.handDesc = describe(p.value); }
  const levels = [...new Set(G.players.filter(p => p.total > 0).map(p => p.total))].sort((a, b) => a - b);
  let prev = 0;
  for (const lv of levels) {
    let amt = 0; for (const p of G.players) amt += Math.max(0, Math.min(p.total, lv) - prev);
    prev = lv;
    if (!amt) continue;
    let elig = live.filter(p => p.total >= lv); if (!elig.length) elig = live;
    const best = Math.max(...elig.map(p => p.value));
    const ws = elig.filter(p => p.value === best);
    const share = Math.floor(amt / ws.length); let rem = amt - share * ws.length;
    for (const w of ws) { const x = share + (rem > 0 ? 1 : 0); if (rem > 0) rem--; w.stack += x; w.won += x; }
  }
  for (const p of live) log(`${p.name} ${p.human ? 'show' : 'shows'} ${p.hole.map(cardText).join(' ')} — ${p.handDesc}`);
  // Winners are those who ended up ahead on the hand (a refunded, uncalled bet doesn't count).
  let top = live.filter(p => p.won > p.total);
  if (!top.length) { const best = Math.max(...live.map(q => q.value)); top = live.filter(p => p.value === best); }
  const lc = s => s.replace(/^./, c => c.toLowerCase());
  const text = top.map(w => `${w.name} ${w.human ? 'win' : 'wins'} ${fmt(w.won)} with ${lc(w.handDesc)}`).join('; ') + '.';
  G.result = { winners: top, text };
  log(G.result.text, 'win');
  finishHand();
}

function finishHand() {
  G.over = true; G.toAct = -1; G.waitingHuman = false; G.thinking = -1;
  render();
  onHandOver();
}

/* ================= Bot brains ================= */
function roundChips(x) { return Math.max(BB, Math.round(x / 5) * 5); }
function botRaise(p, to) {
  to = Math.max(roundChips(to), G.currentBet + G.minRaise);
  if (to >= (p.bet + p.stack) * 0.85) to = p.bet + p.stack; // commit rather than leave a sliver behind
  return { type: 'raise', amount: to };
}

function decideBot(p) {
  const P = PERSONAS[p.persona];
  const toCall = G.currentBet - p.bet;
  const pot = potNow();
  const r = Math.random();
  const opps = G.players.filter(o => !o.folded && o !== p).length;

  if (G.street === 0) {
    const pct = prePct(p.hole[0], p.hole[1]);
    const posAdj = { UTG: .8, CO: 1, BTN: 1.3, SB: .9, BB: 1 }[positionOf(p.id)];
    const j = 0.85 + Math.random() * 0.3;
    if (G.raiseCount === 0) {
      const limpers = G.players.filter(o => o.bet === BB && o.actions.some(a => a.street === 0 && a.type === 'call')).length;
      if (pct <= P.pfr * posAdj * j) return botRaise(p, BB * (P === PERSONAS.maniac && r < .4 ? 4 : 3) + limpers * BB);
      if (toCall === 0) return { type: 'check' };
      if (pct <= P.vpip * posAdj * j) return { type: 'call' };
      return { type: 'fold' };
    }
    const sizeBB = G.currentBet / BB;
    const tight = (G.raiseCount >= 2 ? .45 : 1) * (sizeBB > 12 ? .6 : 1);
    if (pct <= P.threeBet * tight * j) return botRaise(p, G.currentBet * 3);
    const callW = P.vpip * .55 * tight * j + (P.sticky > .1 ? .08 : 0);
    if (pct <= callW || (toCall <= BB && pct <= P.vpip)) return { type: 'call' };
    return toCall === 0 ? { type: 'check' } : { type: 'fold' };
  }

  const eq = equity(p.hole, G.board, new Array(opps).fill(null), 260);
  const edge = eq * (opps + 1); // 1.0 = fair share of the pot
  if (toCall === 0) {
    if (edge > 1.35 && r < .45 + P.agg * .55) return botRaise(p, pot * (.55 + Math.random() * .25));
    if (edge > 1.05 && r < P.agg * .5) return botRaise(p, pot * .5);
    if (r < P.bluff * (opps === 1 ? 1 : .5)) return botRaise(p, pot * (.4 + Math.random() * .3));
    return { type: 'check' };
  }
  const potOdds = toCall / (pot + toCall);
  const facingBig = toCall > pot * .9;
  const eqAdj = eq * (P.sticky > .1 ? 1 : facingBig ? .8 : .9);
  if (edge > 1.6 && r < P.agg && G.raiseCount < 3) return botRaise(p, G.currentBet * 2.6 + pot * .3);
  if (eqAdj >= potOdds - P.sticky) return { type: 'call' };
  if (r < P.bluff * .2 && G.raiseCount < 2 && G.street < 3) return botRaise(p, G.currentBet * 2.6);
  return { type: 'fold' };
}
/* ================= The coach ================= */
const POS_LONG = { BTN: 'the button', SB: 'the small blind', BB: 'the big blind', UTG: 'under the gun', CO: 'the cutoff' };
const POS_NOTE = {
  UTG: 'first to act, with four players still to come',
  CO: 'one seat before the button, a good stealing seat',
  BTN: 'the best seat: you act last on every street after the flop',
  SB: 'you will be first to act after the flop, the worst position',
  BB: 'you already have 20 in the pot, so calling costs less',
};
const OPEN_RANGE = { UTG: .17, CO: .27, BTN: .45, SB: .35, BB: .12 };
const pctTxt = x => `${Math.round(x * 100)}%`;
const pctTop = x => (x < .015 ? 'top 1%' : `top ${Math.round(x * 100)}%`);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const LESSONS = {
  potOdds: ['Pot odds', 'Compare the price of a call with how often you win. Calling 50 into a pot of 150 risks 50 to win 200, so you need to win at least 25% of the time. If your equity is higher than that, the call makes money in the long run.'],
  rule42: ['The rule of 4 and 2', 'Count your outs: the cards that make you a likely winner. With two cards to come, multiply by 4. With one card to come, multiply by 2. Nine flush outs on the flop is about 36%; on the turn it is about 18%.'],
  impliedOdds: ['Implied odds', "When you hit a draw you often win more than what's in the pot now. Against players who pay off, a draw can be worth calling even when the pot odds alone say fold. Against tight players, don't count on it."],
  valueBet: ['Bet for value', 'When you are likely ahead, bet so worse hands pay you. Checking a strong hand gives free cards and earns nothing. Bet bigger on boards with lots of draws and against players who call too much.'],
  semiBluff: ['The semi-bluff', 'Betting a draw wins two ways: they fold now, or you make your hand later. That makes it far stronger than a pure bluff. It works best against players who can fold.'],
  cbet: ['Continuation bet', 'As the preflop raiser you represent the strongest hands. On a dry, unconnected board a small bet (about a third of the pot) wins often, because most hands missed the flop.'],
  position: ['Position', 'Acting last lets you see what everyone else does before you decide. Play more hands from the button and cutoff, and fewer under the gun and from the blinds.'],
  handSelection: ['Starting-hand discipline', 'Most chips are lost by playing too many weak hands. Folding preflop costs nothing; losing a big pot with a second-best hand costs a lot.'],
  setMining: ['Set mining', 'A small pocket pair flops three of a kind about 1 time in 8. Call a raise with one only when the stacks are deep enough to win 15 to 20 times the call when you hit.'],
  threeBet: ['Re-raise for value', "Re-raise (3-bet) with your strongest hands. It builds the pot while you're ahead and often wins it right away. Just calling with a premium hand lets others in cheaply."],
  isolate: ['The isolation raise', 'When players limp in, raise instead of limping behind. You take control, charge the weak hands, and often end up heads-up against the weakest player.'],
  potControl: ['Pot control', 'Medium-strength hands want medium-sized pots. Checking keeps the pot small, lets you see the next card cheaply, and avoids a raise that forces you to fold.'],
  exploit: ['Exploit their style', 'Adjust to the player in front of you. Against a Station, value bet thin and never bluff. Against a Maniac, let them do the betting. Against a Rock, steal often and believe their raises.'],
  trap: ['Let the aggressor bet', 'Against a player who bets too often, checking or just calling with a strong hand can win more than raising. They keep bluffing, and you keep collecting.'],
  blindDefense: ['Defending the big blind', "You already have chips in the pot, so you get a discount to call. Defend wider against small raises, but fold hands that are often dominated, like weak offsuit aces."],
  readRange: ['Think in ranges', "Don't put an opponent on one exact hand. Picture every hand their actions could mean, then narrow that range with each bet, call and check."],
  freeCard: ['Take the free card', 'With a draw and no bet to face, checking shows you the next card for nothing. Do it when a bet would just get called by someone who never folds.'],
  giveUp: ['Know when to give up', "Not every pot is worth fighting for. With no hand, no draw and no reason to think they'll fold, check and let it go. The chips you save count just as much as the ones you win."],
  domination: ['Domination', 'King-jack against ace-king shares a card and wins only about a quarter of the time. Hands with weak kickers win small pots and lose big ones.'],
};

/* ---------- Reading opponents ---------- */
function estimateRange(p) {
  const P = PERSONAS[p.persona];
  const pre = p.actions.filter(a => a.street === 0);
  const lvl = Math.max(0, ...pre.filter(a => a.type === 'raise').map(a => a.level));
  let width = 1;
  if (lvl >= 2) width = P.threeBet;
  else if (lvl === 1) width = P.pfr;
  else if (pre.some(a => a.type === 'call' && a.to > BB)) width = Math.min(1, P.vpip * .55 + (P.sticky > .1 ? .08 : 0));
  else if (pre.some(a => a.type === 'call')) width = P.vpip;
  const post = p.actions.filter(a => a.street > 0);
  const aggr = post.some(a => a.type === 'raise');
  const called = post.some(a => a.type === 'call');
  let cond = false, loose = 1;
  if (aggr) { cond = true; loose = P.bluff; }
  else if (called) { cond = true; loose = P.float; }
  return { width, cond, loose, aggr, called };
}
const rangeOpt = p => { const r = estimateRange(p); return { width: r.width, cond: r.cond, loose: r.loose }; };

function rangeWords(w) {
  if (w <= .035) return 'only premium hands: big pairs and ace-king';
  if (w <= .08) return 'strong hands: tens or better and big aces';
  if (w <= .16) return 'good hands: middle pairs, big aces and suited high cards';
  if (w <= .3) return 'a solid range: any pair, most aces, high cards and suited connectors';
  if (w <= .6) return 'a wide range that includes weak aces, suited cards and gappers';
  return 'almost any two cards';
}

function actionStory(p) {
  const bits = [];
  for (let s = 0; s <= G.street; s++) {
    const acts = p.actions.filter(a => a.street === s);
    if (!acts.length) continue;
    const words = acts.map(a => {
      if (a.type === 'raise') return s === 0 ? (a.level >= 2 ? 're-raised' : 'raised') : (a.level >= 2 ? 'raised' : 'bet');
      if (a.type === 'call') return s === 0 && a.to <= BB ? 'limped' : 'called';
      return a.type === 'check' ? 'checked' : 'folded';
    });
    bits.push(`${words.join(' then ')} ${s === 0 ? 'preflop' : 'the ' + STREETS[s].toLowerCase()}`);
  }
  return bits.length ? bits.join(', ') : "hasn't acted yet";
}

function readFor(p) {
  const P = PERSONAS[p.persona], r = estimateRange(p);
  let line = cap(actionStory(p)) + '. ';
  if (r.width < 1) line += `For ${P.name}, that usually means ${rangeWords(r.width)}.`;
  else line += p.actions.length ? 'Their range is still wide open.' : P.blurb;
  if (r.aggr) line += r.loose <= .12 ? ' They rarely bluff, so take their bets seriously.' : r.loose >= .4 ? " They bluff a lot, so don't fold good hands too easily." : ' Their bets usually mean a pair or a draw.';
  else if (r.called) line += r.loose >= .45 ? " They call with almost anything, so their calls don't mean much." : r.loose <= .15 ? ' When they call, they usually have something.' : ' Their calls usually mean a pair or a draw.';
  return { p, P, line, width: r.width };
}

/* ---------- Hand description ---------- */
function madeInfo(hole, board) {
  const v = evaluate(hole.concat(board)), cat = catOf(v), bcat = catOf(evaluate(board));
  const br = board.map(rankOf).sort((a, b) => b - a), hr = hole.map(rankOf).sort((a, b) => b - a);
  let label = describe(v);
  if (cat === bcat && cat > 0) label = `Only the board's ${CAT_NAME[cat].toLowerCase()} (you have ${RANK_NAME[hr[0]]} high)`;
  else if (cat === 1) {
    const pr = kickersOf(v)[0];
    if (hr[0] === hr[1]) label = pr > br[0] ? `Overpair (${RANK_PL[pr]})` : pr < br[br.length - 1] ? `Underpair (${RANK_PL[pr]})` : `Pocket ${RANK_PL[pr]} below the top card`;
    else if (pr === br[0]) { const k = hr.find(x => x !== pr); label = `Top pair, ${RANK_NAME[k]} kicker`; }
    else if (pr === br[br.length - 1]) label = `Bottom pair (${RANK_PL[pr]})`;
    else label = `Middle pair (${RANK_PL[pr]})`;
  } else if (cat === 3) {
    const t = kickersOf(v)[0];
    label = hr[0] === hr[1] ? `A set of ${RANK_PL[t]}` : `Trips (${RANK_PL[t]})`;
  }
  return { v, cat, label };
}

function heroInPosition() {
  const order = s => { const d = (s - G.dealer + N) % N; return d === 0 ? N : d; };
  return G.players.filter(p => !p.folded && !p.human && !p.allIn).every(p => order(p.id) < order(0));
}

/* ---------- Sizing helpers ---------- */
function clampTo(hero, to) {
  to = Math.max(to, G.currentBet + G.minRaise);
  to = Math.round(to / 5) * 5;
  return Math.min(to, hero.bet + hero.stack);
}
function potBet(hero, frac) {
  const toCall = G.currentBet - hero.bet;
  return clampTo(hero, G.currentBet + frac * (potNow() + toCall));
}

/* ---------- Advice ---------- */
function getAdvice(iters = 1600) {
  const hero = G.players[0];
  const toCall = Math.max(0, G.currentBet - hero.bet);
  const pot = potNow();
  const potOdds = toCall > 0 ? toCall / (pot + toCall) : 0;
  const opps = liveOpponents();
  const core = G.street === 0 ? preflopAdvice(hero, toCall, pot, potOdds, opps, iters) : postflopAdvice(hero, toCall, pot, potOdds, opps, iters);
  const max = hero.bet + hero.stack;
  let verdict;
  if (core.action === 'fold') verdict = 'Fold';
  else if (core.action === 'check') verdict = 'Check';
  else if (core.action === 'call') verdict = toCall >= hero.stack ? `Call all-in` : `Call ${fmt(toCall)}`;
  else verdict = core.amount >= max ? `All-in ${fmt(max)}` : G.currentBet === 0 ? `Bet ${fmt(core.amount)}` : `Raise to ${fmt(core.amount)}`;
  const tone = core.action === 'fold' ? 'stop' : core.action === 'check' || core.close ? 'caution' : 'go';
  return Object.assign(core, { verdict, tone, toCall, pot, potOdds, reads: opps.map(readFor), street: G.street, decisionId: G.decisionId, hand: G.handNo });
}

function preflopAdvice(hero, toCall, pot, potOdds, opps, iters) {
  const [a, b] = hero.hole;
  const pct = prePct(a, b), cls = handClass(a, b), pos = positionOf(0);
  const hi = Math.max(rankOf(a), rankOf(b)), lo = Math.min(rankOf(a), rankOf(b));
  const pair = hi === lo, suited = suitOf(a) === suitOf(b), gap = hi - lo - 1;
  const openW = OPEN_RANGE[pos];
  const invested = opps.filter(p => p.actions.some(x => x.street === 0 && (x.type === 'raise' || x.type === 'call')));
  const eq = invested.length ? equity(hero.hole, [], invested.map(rangeOpt), iters) : null;
  const reasons = [`${cls} is in the ${pctTop(pct)} of starting hands.`, `You're in ${POS_LONG[pos]}: ${POS_NOTE[pos]}.`];
  let action, amount = 0, concept, summary, close = false;

  if (G.raiseCount === 0) {
    const limpers = invested.length;
    if (limpers) reasons.push(`${limpers === 1 ? 'One player has' : limpers + ' players have'} limped in. Limping usually shows a weak or speculative hand.`);
    if (toCall === 0) {
      if (pct <= .12) {
        action = 'raise'; amount = clampTo(hero, BB * (3 + limpers)); concept = 'isolate';
        summary = `Raise to ${fmt(amount)}. You have a strong hand and the limpers are weak. Make them pay to see a flop.`;
      } else {
        action = 'check'; concept = 'potControl';
        summary = "Check and see the flop for free. Your hand isn't strong enough to build a pot out of position.";
      }
    } else if (pct <= openW * (limpers ? .8 : 1)) {
      action = 'raise'; amount = clampTo(hero, BB * (pos === 'SB' ? 3 : 2.5) + limpers * BB);
      concept = limpers ? 'isolate' : 'position';
      summary = limpers ? `Raise to ${fmt(amount)} to isolate. Your hand plays well heads-up against a limper's range.`
                        : `Open-raise to ${fmt(amount)}. From ${POS_LONG[pos]} you should open about the ${pctTop(openW)} of hands, and ${cls} makes the cut.`;
      reasons.push(`A good opening range from here is about the ${pctTop(openW)} of hands.`);
      if (pos === 'UTG') reasons.push('Four players still act after you, so you want a hand that holds up when someone else has something.');
      if (pos === 'BTN' || pos === 'CO') reasons.push('Only the blinds are left to beat, and they will play the hand out of position against you.');
    } else if (limpers && ['BTN', 'CO', 'SB'].includes(pos) && pct <= openW * 1.5 && (pair || (suited && gap <= 1))) {
      action = 'call'; concept = 'impliedOdds';
      summary = `Limp behind for ${fmt(toCall)}. Small pairs and suited connectors play well in cheap multiway pots, because when they hit they hit big.`;
    } else {
      action = 'fold'; concept = 'handSelection';
      summary = `Fold. ${cls} is outside a sensible range from ${POS_LONG[pos]} (about the ${pctTop(openW)}).`;
      reasons.push(`A good opening range from here is about the ${pctTop(openW)} of hands.`);
      if (pos === 'SB') reasons.push("Completing the small blind with weak hands is a classic leak: you'll play the whole hand out of position.");
    }
  } else {
    const raiser = G.players[G.lastAggressor];
    const R = estimateRange(raiser), P = PERSONAS[raiser.persona], w = R.width;
    const n = G.raiseCount;
    const eff = Math.min(hero.stack + hero.bet, raiser.stack + raiser.bet);
    const valueW = n >= 2 ? Math.min(.03, w * .45) : Math.max(.03, Math.min(.09, w * .4));
    let callW = w * (pos === 'BB' ? 1.5 : (pos === 'BTN' || pos === 'CO') ? 1.1 : .8);
    if (n >= 2) callW = w * .6;
    const weakAce = !pair && hi >= 11 && lo < 8 && !suited;
    reasons.push(`${raiser.name} ${n >= 2 ? 're-raised' : 'raised'} to ${fmt(G.currentBet)}. For a ${P.tag.toLowerCase()} player that is roughly the ${pctTop(w)}: ${rangeWords(w)}.`);
    if (eq !== null) reasons.push(`Against those hands you win about ${pctTxt(eq)} of the time. Calling ${fmt(toCall)} needs ${pctTxt(potOdds)}.`);
    if (pct <= valueW) {
      action = 'raise';
      amount = clampTo(hero, G.currentBet * (n >= 2 ? 2.3 : (pos === 'BTN' || pos === 'CO') ? 3 : 3.5));
      if (amount >= (hero.stack + hero.bet) * .4) amount = hero.stack + hero.bet;
      concept = 'threeBet';
      summary = `Re-raise to ${fmt(amount)}. ${cls} is ahead of almost everything ${raiser.name} raises with. Build the pot now.`;
    } else if (pair && n === 1 && toCall * 15 <= eff - toCall) {
      action = 'call'; concept = 'setMining';
      summary = `Call and try to flop a set. ${cls} makes three of a kind about 12% of the time, and there's ${fmt(eff)} behind to win when it does.`;
    } else if (pct <= callW && (eq === null || eq >= potOdds)) {
      action = 'call'; close = pct > callW * .8;
      concept = pos === 'BB' ? 'blindDefense' : 'position';
      summary = `Call ${fmt(toCall)}. Your hand is strong enough to continue against this range${pos === 'BB' ? ", and you're getting a discount from the big blind" : ''}.`;
    } else {
      action = 'fold';
      concept = weakAce ? 'domination' : (w < .12 ? 'readRange' : 'handSelection');
      summary = `Fold. ${cls} doesn't do well against ${raiser.name}'s raising range.`;
      if (weakAce) reasons.push(`${cls} is often dominated: a raiser holds a better ace or king much more often than a worse one.`);
    }
    if (action === 'call') reasons.push(pos === 'BTN' || pos === 'CO' ? "You'll have position after the flop, which makes calling easier." : pos === 'BB' ? 'You already have 20 in the pot, so the price is lower.' : "You'll be out of position after the flop, which makes close calls worse.");
    if (raiser.persona === 'maniac') reasons.push('The Maniac raises with lots of weak hands, so you can play back at them wider than usual.');
    if (raiser.persona === 'rock' || raiser.persona === 'station') reasons.push(`${raiser.name} rarely raises. When they do, it's a strong hand, so only continue with a premium hand or a pair to set-mine.`);
  }
  const stats = [
    { k: 'Your hand', v: cls, sub: pctTop(pct) },
    { k: 'Position', v: pos },
    { k: toCall ? 'To call' : 'Pot', v: fmt(toCall || pot), num: true },
    { k: eq !== null ? 'Equity' : 'Open range', v: eq !== null ? pctTxt(eq) : pctTop(openW), num: true },
  ];
  return { action, amount, concept, summary, reasons, stats, equity: eq, need: toCall > 0 ? potOdds : null, close, handLabel: cls };
}

function postflopAdvice(hero, toCall, pot, potOdds, opps, iters) {
  const board = G.board, street = G.street, toCome = 3 - street;
  const eq = equity(hero.hole, board, opps.map(rangeOpt), iters);
  const made = madeInfo(hero.hole, board);
  const dr = drawInfo(hero.hole, board);
  const { outs, pairOuts } = countOuts(hero.hole, board);
  const tex = boardTexture(board);
  const multi = opps.length > 1;
  const hasStation = opps.some(p => p.persona === 'station');
  const heroPFR = G.preflopRaiser === 0;
  const unseen = 52 - 2 - board.length;
  const hit = toCome === 2 ? 1 - ((unseen - outs) / unseen) * ((unseen - 1 - outs) / (unseen - 1)) : toCome === 1 ? outs / unseen : 0;
  const drawTxt = dr.flushDraw && dr.oesd ? 'a flush draw and an open-ended straight draw' : dr.flushDraw ? 'a flush draw' : dr.oesd ? 'an open-ended straight draw' : dr.gutshot ? 'a gutshot straight draw' : '';
  const strongDraw = outs >= 8 && toCome > 0;
  let action, amount = 0, concept, summary, close = false;

  if (toCall === 0) {
    if (eq >= .65) {
      if (!multi && opps[0].persona === 'maniac' && street < 3) {
        action = 'check'; concept = 'trap';
        summary = "Check and let the Maniac bet for you. You're well ahead and they bluff constantly.";
      } else {
        action = 'raise'; amount = potBet(hero, hasStation ? .8 : tex.wet ? .7 : .55); concept = hasStation ? 'exploit' : 'valueBet';
        summary = `Bet ${fmt(amount)} for value. You're ahead of most hands they could have${hasStation ? ', and the Station will call with worse' : ''}.`;
      }
    } else if (eq >= .45 && !multi && ((tex.wet && street < 3) || (street === 3 && eq >= .55))) {
      action = 'raise'; amount = potBet(hero, street === 3 ? .4 : .5); concept = 'valueBet';
      summary = street === 3 ? 'Make a small value bet. Plenty of worse hands will call a modest bet on the river.'
                             : "Bet about half the pot. You're probably ahead, and on this board you want draws to pay to catch up.";
    } else if (eq >= .45) {
      action = 'check'; concept = 'potControl';
      summary = multi ? 'Check. A medium-strength hand against several players wants a small pot.' : 'Check to keep the pot small with a medium-strength hand.';
    } else if (strongDraw) {
      if (hasStation) { action = 'check'; concept = 'freeCard'; summary = "Take the free card. The Station won't fold, so betting your draw has little chance of winning the pot right now."; }
      else { action = 'raise'; amount = potBet(hero, .6); concept = 'semiBluff'; summary = `Semi-bluff: bet ${fmt(amount)}. They may fold now, and if not you have ${outs} outs to make your hand.`; }
    } else if (heroPFR && street === 1 && !multi && !tex.wet && opps[0].persona !== 'station') {
      action = 'raise'; amount = potBet(hero, .33); concept = 'cbet';
      summary = `Make a small continuation bet of ${fmt(amount)}. You raised preflop, and this dry board rarely helps the player who called.`;
    } else {
      action = 'check';
      concept = eq >= .3 ? 'potControl' : hasStation ? 'exploit' : 'giveUp';
      summary = eq >= .3 ? 'Check. You have some chance to win at showdown, but not enough to bet.'
              : hasStation ? "Check. Bluffing the Station doesn't work because they almost never fold."
              : "Check, and be ready to let it go if they bet. You have little equity and no good reason to bluff.";
    }
  } else {
    const bettor = G.players[G.lastAggressor];
    const BP = bettor && !bettor.human ? PERSONAS[bettor.persona] : null;
    const impl = outs >= 4 && toCome > 0 ? (opps.some(p => p.persona === 'station' || p.persona === 'maniac') ? .06 : .03) : 0;
    if (eq >= .72 && G.raiseCount < 3) {
      if (!multi && BP && bettor.persona === 'maniac' && street < 3) {
        action = 'call'; concept = 'trap';
        summary = "Just call. You're well ahead, and the Maniac will keep betting into you on the next streets.";
      } else {
        action = 'raise'; amount = clampTo(hero, G.currentBet * 3); concept = 'valueBet';
        summary = `Raise to ${fmt(amount)}. You're a big favourite against their likely hands, so make them pay.`;
      }
    } else if (eq + impl >= potOdds + .03) {
      action = 'call';
      const needImpl = eq < potOdds + .03;
      concept = needImpl ? 'impliedOdds' : strongDraw && made.cat < 2 ? 'rule42' : 'potOdds';
      summary = needImpl ? `Call. The price is slightly too high on its own, but you'll win extra chips when you hit, and that makes up the difference.`
                         : `Call. You win about ${pctTxt(eq)} of the time and only need ${pctTxt(potOdds)}.`;
    } else if (eq + impl >= potOdds - .04) {
      close = true;
      if (BP && BP.bluff >= .2) { action = 'call'; concept = 'readRange'; summary = `A close call, and the coach leans call. ${bettor.name} bluffs often enough that folding here gives up too much.`; }
      else { action = 'fold'; concept = 'potOdds'; summary = `A close call, but fold. ${bettor ? bettor.name + ' rarely bluffs' : 'Their bet is usually real'}, so your real equity is probably lower than it looks.`; }
    } else {
      action = 'fold'; concept = outs > 0 ? 'rule42' : 'potOdds';
      summary = `Fold. You need ${pctTxt(potOdds)} to call but only win about ${pctTxt(eq)} of the time against their likely hands.`;
    }
  }

  const reasons = [];
  reasons.push(`You have ${made.label.charAt(0).toLowerCase() + made.label.slice(1)}${drawTxt ? `, plus ${drawTxt}` : ''}.`);
  reasons.push(tex.wet ? `The board is ${tex.desc || 'coordinated'}: lots of draws are possible, so strong hands should bet to charge them.`
                       : `The board is ${tex.desc ? tex.desc + ' and ' : ''}fairly dry: few draws, so hands rarely change much on later cards.`);
  if (outs > 0 && toCome > 0) {
    const m = toCome === 2 ? 4 : 2;
    reasons.push(`${outs} outs to a straight or better. Rule of ${m}: ${outs} × ${m} ≈ ${outs * m}% to hit (exactly ${pctTxt(hit)}).`);
  }
  if (pairOuts > 0 && toCome > 0) reasons.push(`${pairOuts} more cards would pair one of your overcards. Count those as weaker outs, because one pair may not be enough.`);
  if (toCall > 0) reasons.push(`Pot odds: call ${fmt(toCall)} to win ${fmt(pot + toCall)}, so you need ${pctTxt(potOdds)} equity. Against their likely hands you have about ${pctTxt(eq)}.`);
  else reasons.push(`Against their likely hands you win about ${pctTxt(eq)} of the time${multi ? ` (${opps.length} opponents, so a fair share would be ${pctTxt(1 / (opps.length + 1))})` : ''}.`);
  reasons.push(heroInPosition() ? "You're in position: you act last, so you get to see what they do first." : "You're out of position: you act before them, so you give away information every street.");

  const stats = [
    { k: 'Your hand', v: made.label },
    { k: 'Equity', v: pctTxt(eq), num: true },
    { k: toCall ? 'Need' : 'Pot', v: toCall ? pctTxt(potOdds) : fmt(pot), num: true },
    { k: 'Outs', v: toCome ? String(outs) : 'River', num: true },
  ];
  return { action, amount, concept, summary, reasons, stats, equity: eq, need: toCall > 0 ? potOdds : null, close, handLabel: made.label };
}

/* ---------- Reviewing the player's decision ---------- */
function judge(adv, type) {
  const A = adv.action, t = type === 'bet' ? 'raise' : type;
  const verb = { fold: 'fold', check: 'check', call: 'call', raise: G.currentBet === 0 && adv.street > 0 ? 'bet' : 'raise' };
  if (t === A) return { level: 'good', text: `Same as the coach: ${adv.verdict.toLowerCase()}. ${adv.summary}` };
  if (t === 'fold' && adv.toCall === 0) return { level: 'leak', text: 'You folded when you could have checked for free. Never fold when checking costs nothing.' };
  if (adv.close) return { level: 'ok', text: `A close spot. The coach leaned towards ${adv.verdict.toLowerCase()}, but your play is reasonable too.` };
  if (t === 'fold') {
    if (adv.equity != null && adv.need != null && adv.equity > adv.need) return { level: 'leak', text: `Too tight. You had about ${pctTxt(adv.equity)} equity and only needed ${pctTxt(adv.need)}. The coach would ${adv.verdict.toLowerCase()}.` };
    return { level: 'leak', text: `Too tight. The coach would ${adv.verdict.toLowerCase()}: ${adv.summary}` };
  }
  if (A === 'fold') {
    if (adv.street === 0) return { level: 'leak', text: `Too loose. ${adv.summary}` };
    return { level: 'leak', text: `Costly ${verb[t]}. You needed ${pctTxt(adv.need ?? 0)} but had only about ${pctTxt(adv.equity)} equity. ${adv.summary}` };
  }
  if (A === 'raise') return { level: 'ok', text: `Missed value. The coach would ${adv.verdict.toLowerCase()}: ${adv.summary}` };
  if (t === 'raise' && adv.equity != null && adv.equity < .3 && liveOpponents().some(p => p.persona === 'station'))
    return { level: 'leak', text: 'Bluffing into the Station rarely works. They call with almost anything.' };
  return { level: 'ok', text: `The coach preferred to ${adv.verdict.toLowerCase()}. ${adv.summary}` };
}

function cardHTML(c, size = '', extra = '') {

}
const backHTML = size => `<div class="card back ${size}" role="img" aria-label="Face-down card"></div>`;
const sigilHTML = p => p.human ? `<div class="sigil" style="--c:var(--paper)">Y</div>` : `<div class="sigil" style="--c:${PERSONAS[p.persona].color}">${PERSONAS[p.persona].sigil}</div>`;

function buildTable() {
  const t = $('table');

  });

}
function placeChips() {
  const m = narrow.matches;
  const BETS = m ? [[50, 67], [31, 62], [22, 31], [78, 31], [69, 62]] : [[50, 68], [24, 57], [31, 28], [69, 28], [76, 57]];
  const DB = m ? [[77, 80], [9, 52], [36, 12], [64, 12], [91, 52]] : [[63, 79], [19, 49], [33, 14], [67, 14], [81, 49]];
  els.bets.forEach((b, i) => { b.style.left = BETS[i][0] + '%'; b.style.top = BETS[i][1] + '%'; });
  els.dbtn.style.left = DB[G.dealer][0] + '%'; els.dbtn.style.top = DB[G.dealer][1] + '%';
}

function render() {
  renderTable(); renderKpis(); renderActions(); renderCoach();
  if (ui.tab === 'chart') renderChart();
  if (ui.tab === 'log') renderLog();
}

function renderTable() {
  const winners = new Set((G.result ? G.result.winners : []).map(w => w.id));
  G.players.forEach((p, i) => {
    const S = els.seats[i];
    const mine = !G.over && G.toAct === i && (G.thinking === i || (p.human && G.waitingHuman));
    S.root.classList.toggle('active', mine);
    S.root.classList.toggle('folded', p.folded && !p.human);
    S.root.classList.toggle('winner', G.over && winners.has(i));
    let cards = '';
    if (p.hole.length) {
      if (p.human) cards = p.hole.map(c => cardHTML(c, 'xl', p.folded ? 'dim' : '')).join('');
      else if (p.shown) cards = p.hole.map(c => cardHTML(c, 'sm')).join('');
      else if (!p.folded) cards = backHTML('sm') + backHTML('sm');
    }
    setHTML(S.hole, cards);
    setHTML(S.stack, `${p.allIn && !G.over ? 'All-in' : fmt(p.stack)} · <em class="ps">${positionOf(i)}</em>`);
    let bub = '', cls = 'bubble';
    if (G.thinking === i) bub = '<span class="dots" aria-label="Thinking"><i></i><i></i><i></i></span>';
    else if (G.over && winners.has(i)) { bub = `Wins ${fmt(p.won)}`; cls += ' win'; }
    else { bub = p.lastAction; if (/bet|raise|all-in/i.test(bub)) cls += ' hot'; }
    S.bubble.className = cls; setHTML(S.bubble, bub);
    setHTML(S.sd, p.shown && p.handDesc ? `<span class="showname">${p.handDesc}</span>` : '');
    const b = els.bets[i];
    b.hidden = !(p.bet > 0);
    if (p.bet > 0) setHTML(b, `<span class="chip"></span>${fmt(p.bet)}`);
  });
  placeChips();
  const slots = [];
  for (let k = 0; k < 5; k++) slots.push(G.board[k] !== undefined ? cardHTML(G.board[k], 'lg') : '<div class="slot"></div>');
  setHTML($('board'), slots.join(''));
  $('street').textContent = G.over ? (G.result && G.board.length === 5 && G.players.filter(p => !p.folded).length > 1 ? 'Showdown' : 'Hand over') : STREETS[G.street];
  const pot = potNow();
  setHTML($('pot'), !G.over && pot > 0 ? `<span class="chip"></span>Pot ${fmt(pot)}` : '');
  const ban = $('banner');
  ban.hidden = !G.result;
  if (G.result) setHTML(ban, G.result.text.replace(/(You|The \w+)( wins?)/g, '<b>$1</b>$2'));
}

function renderKpis() {
  const h = G.players[0];

  $('kStack').textContent = fmt(h.stack);

}

/* ---------- action bar ---------- */
function myTurn() { return G.waitingHuman && G.toAct === 0 && !G.over; }
function raiseBounds() {
  const h = G.players[0];
  const max = h.bet + h.stack;
  const min = Math.min(G.currentBet + G.minRaise, max);
  const othersCanAct = G.players.some(p => !p.human && canAct(p));
  return { min, max, can: myTurn() && h.stack > G.currentBet - h.bet && othersCanAct };
}
function presetList() {
  const h = G.players[0];
  const max = h.bet + h.stack;
  const L = [];
  if (G.street === 0 && G.raiseCount === 0) L.push(['2.5 BB', clampTo(h, BB * 2.5)], ['3 BB', clampTo(h, BB * 3)], ['4 BB', clampTo(h, BB * 4)]);
  else if (G.street === 0) L.push(['3×', clampTo(h, G.currentBet * 3)], ['4×', clampTo(h, G.currentBet * 4)]);
  else L.push(['⅓ pot', potBet(h, 1 / 3)], ['½ pot', potBet(h, .5)], ['⅔ pot', potBet(h, 2 / 3)], ['Pot', potBet(h, 1)]);
  L.push(['All-in', max]);
  return L;
}
function setAmount(v) {
  const { min, max } = raiseBounds();
  v = Math.round(v / 5) * 5;
  if (v >= max || max - v < 5) v = max;
  ui.amount = Math.max(min, Math.min(max, v));
  renderActions();
}

function renderActions() {
  const h = G.players[0];
  const my = myTurn();
  const toCall = Math.max(0, G.currentBet - h.bet);
  $('bNext').hidden = !G.over;
  $('actBtns').hidden = G.over;
  $('sizer').hidden = G.over;
  $('bTip').disabled = !my;
  const st = $('status');
  if (G.over) setHTML(st, "<b>Hand over.</b> Deal the next one when you're ready.");
  else if (my) setHTML(st, `<b>Your turn.</b> ${toCall ? `${fmt(toCall)} to call` : 'No bet to you'} · pot ${fmt(potNow())}`);
  else if (h.folded) setHTML(st, 'You folded. Watch how the bots play it out.');
  else if (G.thinking >= 0) setHTML(st, `Waiting for <b>${G.players[G.thinking].name}</b>…`);
  else setHTML(st, h.allIn ? "You're all-in. Running out the board…" : 'Dealing…');

  const bF = $('bFold'), bC = $('bCall'), bR = $('bRaise');
  bF.disabled = !my || toCall === 0;
  bF.title = toCall === 0 ? 'Checking is free, so there is no reason to fold' : '';
  setHTML(bC, (toCall ? (toCall >= h.stack ? `Call all-in ${fmt(h.stack)}` : `Call ${fmt(toCall)}`) : 'Check') + '<kbd>C</kbd>');
  bC.disabled = !my;
  const rb = raiseBounds();
  if (ui.amount < rb.min || ui.amount > rb.max) ui.amount = rb.min;
  bR.disabled = !rb.can;
  const allIn = ui.amount >= rb.max;
  setHTML(bR, (allIn ? `All-in ${fmt(rb.max)}` : G.currentBet === 0 ? `Bet ${fmt(ui.amount)}` : `Raise to ${fmt(ui.amount)}`) + '<kbd>R</kbd>');
  const sz = $('sizer');
  sz.classList.toggle('off', !rb.can);
  const r = $('rAmt'), n = $('nAmt');
  r.min = rb.min; r.max = rb.max; r.value = ui.amount;
  n.min = rb.min; n.max = rb.max; if (document.activeElement !== n) n.value = ui.amount;
  r.disabled = n.disabled = !rb.can;
  const pl = rb.can ? presetList() : [];
  setHTML($('presets'), pl.map(([l, v]) => `<button class="preset" type="button" data-v="${v}"${v < rb.min ? ' disabled' : ''}>${l}</button>`).join(''));
}

function humanAct(type) {
  if (!myTurn()) return;
  let adv = ui.advice && ui.advice.decisionId === G.decisionId ? ui.advice : null;
  if (!adv) { try { adv = getAdvice(900); } catch (e) { adv = null; } }
  if (adv) {
    const j = judge(adv, type);
    G.stats.decisions++;
    if (j.level === 'good' || (adv.close && j.level !== 'leak')) G.stats.agreed++;
    if (j.level === 'leak') G.stats.leaks++;
    log(`Coach: ${j.text}`, j.level === 'leak' ? 'leak' : '');
    if ($('optAlerts').checked) showAlert(j.level, { good: 'Good play', ok: 'Worth knowing', leak: 'Leak' }[j.level], j.text);
    else $('alert').hidden = true;
  }
  act(G.players[0], type, type === 'raise' ? ui.amount : 0);
}
function showAlert(level, tag, text) {
  const a = $('alert');
  a.className = `alert ${level}`;
  a.innerHTML = `<span class="tag">${tag}</span><span>${text}</span>`;
  a.hidden = false;
}

function onHumanTurn() {
  const h = G.players[0];
  let d;
  if (G.street === 0 && G.raiseCount === 0) d = clampTo(h, BB * 2.5 + G.players.filter(p => !p.human && p.actions.some(a => a.type === 'call')).length * BB);
  else if (G.street === 0) d = clampTo(h, G.currentBet * 3);
  else d = potBet(h, 2 / 3);
  ui.amount = d;
  renderActions();
}
function onHandOver() { renderActions(); renderCoach(); }

function askCoach() {
  if (!myTurn()) return;
  const b = $('bTip');
  b.disabled = true;
  setHTML($('status'), '<b>The coach is thinking…</b> Simulating how this hand could run out.');
  setTimeout(() => {
    ui.advice = getAdvice(1600);
    selectTab('coach');
    render();
    if (stacked.matches) {
      const a = ui.advice;
      showAlert('tip', 'Coach', `<b>${a.verdict}.</b> ${a.summary} <a href="#coach" class="seewhy">See why ↓</a>`);
    }
  }, 30);
}

/* ---------- starting-hand chart ---------- */

/* ---------- history ---------- */
function renderLog() {
  const items = G.log.slice(-160).map(e => `<li class="${e.kind}">${e.kind === 'hand' ? e.text : e.text}</li>`).join('');
  const el = $('log'); const p = $('paneLog');
  const atBottom = p.scrollTop + p.clientHeight >= p.scrollHeight - 30;
  setHTML(el, items);
  if (atBottom) p.scrollTop = p.scrollHeight;
}

function selectTab(name) {
  ui.tab = name;
  for (const [t, pane] of [['coach', 'paneCoach'], ['chart', 'paneChart'], ['log', 'paneLog']]) {
    $('t' + cap(t)).setAttribute('aria-selected', String(t === name));
    $(pane).hidden = t !== name;
  }
  if (name === 'chart') renderChart();
  if (name === 'log') { renderLog(); $('paneLog').scrollTop = $('paneLog').scrollHeight; }
}

/* ---------- wiring ---------- */
function bind() {
  $('bFold').onclick = () => humanAct('fold');
  $('bCall').onclick = () => humanAct(G.currentBet - G.players[0].bet > 0 ? 'call' : 'check');
  $('bRaise').onclick = () => humanAct('raise');
  $('bTip').onclick = askCoach;
  $('bNext').onclick = () => { $('alert').hidden = true; ui.advice = null; startHand(); };
  $('rAmt').oninput = e => setAmount(+e.target.value);
  $('nAmt').onchange = e => setAmount(+e.target.value || 0);
  $('presets').onclick = e => { const b = e.target.closest('.preset'); if (b && !b.disabled) setAmount(+b.dataset.v); };
  $('tCoach').onclick = () => selectTab('coach');
  $('tChart').onclick = () => selectTab('chart');
  $('tLog').onclick = () => selectTab('log');
  $('paneChart').onclick = e => { const b = e.target.closest('[data-pos]'); if (b) { ui.chartPos = b.dataset.pos; renderChart(); } };
  $('alert').onclick = e => { if (e.target.closest('.seewhy')) { e.preventDefault(); selectTab('coach'); $('coach').scrollIntoView({ behavior: 'smooth', block: 'start' }); } };
  const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const read = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  if (read('pc-fast') === '1') $('optFast').checked = true;
  if (read('pc-alerts') === '0') $('optAlerts').checked = false;
  G.fast = $('optFast').checked;
  $('optFast').onchange = e => { G.fast = e.target.checked; store('pc-fast', e.target.checked ? '1' : '0'); };
  $('optAlerts').onchange = e => { store('pc-alerts', e.target.checked ? '1' : '0'); if (!e.target.checked) $('alert').hidden = true; };
  narrow.addEventListener('change', placeChips);
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    const k = e.key.toLowerCase();
    if (k === 'f' && !$('bFold').disabled) $('bFold').click();
    else if (k === 'c' && !$('bCall').disabled) $('bCall').click();
    else if (k === 'r' && !$('bRaise').disabled) $('bRaise').click();
    else if (k === 't' && !$('bTip').disabled) $('bTip').click();
    else if (k === 'n' && !$('bNext').hidden) $('bNext').click();
  });
}

makePlayers();
G.dealer = Math.floor(Math.random() * N);
buildTable();
bind();
startHand();
</script>
