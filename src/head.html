<title>Pocket Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..800;1,6..96,500..700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --room:#101315; --room-2:#15191c;
  --felt:#1b4a42; --felt-hi:#246156; --felt-lo:#11322c;
  --rail:#2a1e17; --rail-hi:#3b2a20;
  --brass:#d4af63; --brass-dim:#8f7644; --brass-ink:#1a1408;
  --ink:#ece5d4; --ink-2:#b0a896; --ink-3:#7c7668;
  --panel:#171b1e; --panel-2:#1f2428; --line:#2d3338;
  --paper:#f6f1e5; --paper-edge:#d8cfbb;
  --spade:#17191d; --heart:#b3261e; --diamond:#1d5ca6; --club:#2b774a;
  --good:#7cc88a; --warn:#e6b450; --bad:#e67661;
  --display:'Bodoni Moda','Bodoni 72','Didot',Georgia,serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--room);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
kbd{font-family:var(--mono);font-size:10px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.55;margin-left:6px}

.app{max-width:1340px;margin:0 auto;padding-inline:16px;padding-block:18px 32px;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(30px,4vw,44px);line-height:1;letter-spacing:-.01em}
.brand h1 em{color:var(--brass);font-weight:500}
.brand p{margin:6px 0 0;color:var(--ink-2);max-width:56ch;font-size:14px}
.kpis{display:flex;gap:6px 22px;flex-wrap:wrap;margin:0}
.kpis div{min-width:0}
.kpis dt{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.kpis dd{margin:2px 0 0;font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* ---------- table ---------- */
.table{position:relative;width:100%;aspect-ratio:16/9.4;margin-top:6px}
.felt{position:absolute;inset:8% 6% 11% 6%;border-radius:999px;
  background:repeating-linear-gradient(35deg,rgba(255,255,255,.014) 0 2px,transparent 2px 5px),radial-gradient(ellipse at 50% 40%,var(--felt-hi),var(--felt) 55%,var(--felt-lo));
  box-shadow:0 0 0 12px var(--rail),0 0 0 13px var(--rail-hi),0 0 0 14px rgba(212,175,99,.4),0 28px 70px rgba(0,0,0,.6),inset 0 0 70px rgba(0,0,0,.5)}
.felt::after{content:'';position:absolute;inset:16px;border-radius:inherit;border:1px solid rgba(212,175,99,.16)}
.felt-print{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);font-family:var(--display);font-style:italic;font-size:13px;color:rgba(212,175,99,.34);white-space:nowrap;letter-spacing:.04em}
.center{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:9px;z-index:1;width:60%}
.street{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(236,229,212,.55)}
.board{display:flex;gap:6px}
.slot{--w:50px;width:var(--w);aspect-ratio:5/7;border-radius:6px;border:1px dashed rgba(236,229,212,.14)}
.pot{font-family:var(--mono);font-size:14px;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.28);padding:3px 12px 3px 5px;border-radius:999px;font-variant-numeric:tabular-nums}
.pot:empty{display:none}
.banner{font-size:13.5px;text-align:center;color:var(--ink);background:rgba(10,12,13,.78);border:1px solid rgba(212,175,99,.45);padding:6px 12px;border-radius:10px;max-width:100%;text-wrap:balance}
.banner b{color:var(--brass)}

.chip{width:15px;height:15px;border-radius:50%;background:var(--brass);box-shadow:inset 0 0 0 2px var(--brass),inset 0 0 0 3.5px #fff6,inset 0 0 0 5px var(--brass);flex:none}

.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;width:132px;z-index:2}
.seat .hole{display:flex;gap:3px;min-height:44px;align-items:flex-end}
.plate{display:flex;align-items:center;gap:8px;width:100%;background:rgba(14,17,19,.94);border:1px solid var(--line);border-radius:12px;padding:5px 9px 5px 5px;transition:border-color .2s,box-shadow .2s}
.seat.active .plate{border-color:var(--brass);box-shadow:0 0 0 3px rgba(212,175,99,.2)}
.seat.folded{opacity:.45}
.seat.winner .plate{border-color:var(--good);box-shadow:0 0 0 3px rgba(124,200,138,.25)}
.sigil{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:700;font-size:16px;color:#101315;background:var(--c,#ccc)}
.who{min-width:0;flex:1}
.who b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.who .ps{font-family:var(--body);font-style:normal;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--brass)}
.sd:empty{display:none}
.bubble{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink-2);min-height:15px;white-space:nowrap}
.bubble.hot{color:var(--brass)}
.bubble.win{color:var(--good)}
.showname{font-size:11px;color:var(--ink);background:rgba(0,0,0,.45);padding:1px 7px;border-radius:6px;white-space:nowrap}
.dots{display:inline-flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--brass);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.seat.hero{width:176px}
.seat.hero .plate{padding:6px 12px 6px 6px}
.seat.hero .hole{min-height:70px}

.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.34);padding:2px 9px 2px 3px;border-radius:999px;z-index:1;font-variant-numeric:tabular-nums}
.dbtn{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--paper);color:#15181a;font:700 11px var(--body);display:grid;place-items:center;box-shadow:0 2px 5px rgba(0,0,0,.5);z-index:1;transition:left .4s,top .4s}

/* seat positions: 0 = you, then clockwise */
.s0{left:50%;top:90%} .s1{left:9%;top:64%} .s2{left:23%;top:11%} .s3{left:77%;top:11%} .s4{left:91%;top:64%}

/* ---------- cards ---------- */
.card{--w:44px;width:var(--w);aspect-ratio:5/7;border-radius:calc(var(--w)*.12);background:var(--paper);box-shadow:inset 0 -2px 0 var(--paper-edge),0 3px 8px rgba(0,0,0,.45);position:relative;color:var(--sc);font-family:var(--display);flex:none;animation:deal .28s ease-out}
.card .r{position:absolute;left:11%;top:3%;font-weight:700;font-size:calc(var(--w)*.42);line-height:1.05;letter-spacing:-.04em}
.card .s{position:absolute;right:9%;bottom:3%;font-size:calc(var(--w)*.52);line-height:1;font-family:'Segoe UI Symbol','Apple Symbols',var(--body)}
.card.sp{--sc:var(--spade)} .card.he{--sc:var(--heart)} .card.di{--sc:var(--diamond)} .card.cl{--sc:var(--club)}
.card.back{background:radial-gradient(circle at 50% 50%,transparent 32%,rgba(212,175,99,.25) 33%,transparent 35%),repeating-linear-gradient(45deg,#5b1e25 0 3px,#6d272e 3px 6px);box-shadow:inset 0 0 0 2px var(--paper),0 3px 8px rgba(0,0,0,.45)}
.card.dim{filter:brightness(.55) saturate(.6)}
.card.lift{transform:translateY(-6px);box-shadow:0 0 0 2px var(--good),0 6px 14px rgba(0,0,0,.5)}
.card.sm{--w:30px}
.card.lg{--w:52px}
.card.xl{--w:56px}
@keyframes deal{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}

/* ---------- action bar ---------- */
.play{min-width:0}
.alert{margin-top:14px;padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.alert.leak{background:rgba(230,118,97,.09);border-color:rgba(230,118,97,.45)}
.alert.good{background:rgba(124,200,138,.08);border-color:rgba(124,200,138,.4)}
.alert.ok{background:rgba(230,180,80,.08);border-color:rgba(230,180,80,.4)}
.alert .tag{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding-top:2px;white-space:nowrap}
.alert.tip{background:rgba(212,175,99,.08);border-color:rgba(212,175,99,.5)}
.alert.tip .tag{color:var(--brass)}
.alert a{color:var(--brass);white-space:nowrap}
.stat small{color:var(--ink-3);font-weight:500;font-size:12px;font-family:var(--body)}
.alert.leak .tag{color:var(--bad)} .alert.good .tag{color:var(--good)} .alert.ok .tag{color:var(--warn)}
.actions{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.act-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.status{font-size:14px;color:var(--ink-2)}
.status b{color:var(--ink);font-weight:600}
.btn{font:600 15px var(--body);border-radius:11px;padding:12px 16px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;transition:transform .08s,filter .15s,opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-variant-numeric:tabular-nums}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.call{background:#e8e1ce;color:#15181a;border-color:#e8e1ce}
.btn.raise{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.fold{color:var(--bad)}
.btn.coachb{background:transparent;border-color:var(--brass-dim);color:var(--brass);padding:9px 14px;font-size:14px}
.btn.coachb svg{width:17px;height:17px;margin-right:4px}
.act-btns{display:grid;grid-template-columns:1fr 1.3fr 1.5fr;gap:10px}
.act-btns .btn{min-height:50px}
.sizer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{font:500 12.5px var(--body);padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
.preset:hover:not(:disabled){color:var(--ink);border-color:var(--brass-dim)}
.preset:disabled{opacity:.35;cursor:not-allowed}
.sizer input[type=range]{flex:1 1 140px;accent-color:var(--brass);min-width:0}
.sizer input[type=number]{width:88px;background:var(--room-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 8px;font:500 14px var(--mono)}
.sizer.off{opacity:.35;pointer-events:none}

/* ---------- coach panel ---------- */
.coach{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:sticky;top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;max-height:calc(100vh - 28px)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;padding:13px 8px;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.pane{padding:18px;overflow:auto;flex:1;min-height:0}
.coach-foot{flex:none;border-top:1px solid var(--line);padding:10px 18px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2)}
.coach-foot label{display:flex;align-items:center;gap:7px;cursor:pointer}
.coach-foot input{accent-color:var(--brass)}

.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 6px}
.h2{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.muted{color:var(--ink-2);font-size:14px;margin:0}
.stack{display:grid;gap:18px}
.roster{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.roster li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.roster b{font-weight:600}
.roster .tagline{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-left:6px}
.roster p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.roster p em{color:var(--ink);font-style:normal}

.tip.stale{opacity:.5}
.stale-note{font-size:12.5px;color:var(--warn);margin:0 0 10px}
.verdict{font-family:var(--display);font-weight:700;font-size:36px;line-height:1.02;margin:0;letter-spacing:-.005em}
.verdict.go{color:var(--good)} .verdict.caution{color:var(--warn)} .verdict.stop{color:var(--bad)}
.summary{margin:8px 0 0;font-size:15px;text-wrap:pretty}
.meter{margin-top:4px}
.meter-bar{position:relative;height:12px;border-radius:999px;background:var(--panel-2);overflow:visible}
.meter-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--brass-dim),var(--brass))}
.meter-need{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px}
.meter-legend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:7px;gap:10px}
.meter-legend b{color:var(--ink);font-weight:500}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--panel-2);border-radius:10px;padding:8px 11px;min-width:0}
.stat .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-size:14.5px;font-weight:600;margin-top:1px}
.stat .v.num{font-family:var(--mono);font-weight:500;font-size:17px}
.reasons{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.reasons li{position:relative;padding-left:18px;font-size:14px;color:var(--ink);text-wrap:pretty}
.reasons li::before{content:'';position:absolute;left:3px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--brass)}
.reads{display:grid;gap:12px}
.read{display:grid;grid-template-columns:30px 1fr;gap:10px}
.read b{font-weight:600;font-size:14px}
.read p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2);text-wrap:pretty}
.read .w{font-family:var(--mono);font-size:11.5px;color:var(--brass);margin-left:6px}
.lesson{border:1px solid rgba(212,175,99,.32);background:rgba(212,175,99,.06);border-radius:14px;padding:14px 16px}
.lesson h3{font-family:var(--display);font-style:italic;font-weight:600;font-size:21px;margin:0 0 6px;color:var(--brass)}
.lesson p{margin:0;font-size:14px;color:var(--ink);text-wrap:pretty}

.chart-pos{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.chart-pos button{font:600 12px var(--body);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
.chart-pos button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.grid13{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;font-family:var(--mono);font-size:9.5px}
.grid13 div{aspect-ratio:1;display:grid;place-items:center;border-radius:3px;background:var(--panel-2);color:var(--ink-3);letter-spacing:-.04em}
.grid13 div.in{background:rgba(212,175,99,var(--a,.8));color:var(--brass-ink);font-weight:600}
.grid13 div.me{outline:2px solid var(--ink);outline-offset:-1px;position:relative;z-index:1}
.chart-key{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.chart-key span{display:inline-flex;align-items:center;gap:6px}
.chart-key i{width:12px;height:12px;border-radius:3px;display:inline-block}

.log{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:13px}
.log li{color:var(--ink-2);text-wrap:pretty}
.log li.hand{color:var(--brass);font-family:var(--display);font-style:italic;font-size:15px;margin-top:10px}
.log li.street{color:var(--ink);font-weight:600;font-size:12px;letter-spacing:.06em}
.log li.win{color:var(--good)}
.log li.leak{color:var(--bad)}
.log li.me{color:var(--ink)}

/* ---------- responsive ---------- */
@media (max-width:1060px){
  .app{grid-template-columns:minmax(0,1fr)}
  .coach{position:static;max-height:none}
  .pane{overflow:visible}
}
@media (max-width:640px){
  .table{aspect-ratio:4/5}
  .felt{inset:9% 7% 13% 7%;border-radius:46%/34%}
  .felt-print{bottom:12%;font-size:11px}
  .center{top:46%;width:86%}
  .slot,.board .card{--w:40px}
  .board{gap:4px}
  .seat{width:98px}
  .seat.hero{width:150px}
  .plate{padding:4px 6px 4px 4px;gap:6px}
  .sigil{width:24px;height:24px;font-size:13px}
  .who b{font-size:11.5px}
  .who span{font-size:11px}
  .seat .card.sm{--w:25px}
  .seat .hole{min-height:36px}
  .seat.hero .card.xl{--w:48px}
  .seat.hero .hole{min-height:68px}
  .s0{top:89%} .s1{left:15%;top:67%} .s2{left:18%;top:17%} .s3{left:82%;top:17%} .s4{left:85%;top:67%}
  .act-btns{grid-template-columns:1fr 1fr}
  .act-btns #bRaise{grid-column:1/-1}
  .kpis{gap:4px 16px}
  .kpis dd{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
