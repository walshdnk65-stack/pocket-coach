<title>Pocket Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#090c11; --bg-2:#0e131a;
  --surface:#131922; --surface-2:#1a212b; --surface-3:#232c38;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --text:#e9edf2; --text-2:#9ba6b5; --text-3:#667285;
  --felt-1:#1b4468; --felt-2:#123251; --felt-3:#0b1f35;
  --accent:#f5b942; --accent-ink:#1c1304; --accent-soft:rgba(245,185,66,.13);
  --good:#3ecf8e; --warn:#fb923c; --bad:#f87171;
  --card:#fbfaf6; --sp:#151922; --he:#e11d48; --di:#2563eb; --cl:#05976a;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Sora','Manrope',system-ui,sans-serif;
  --suit:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;background:radial-gradient(1100px 520px at 35% -8%,#12203a 0%,transparent 65%),var(--bg);min-height:100vh}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:16px 36px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px 24px;align-items:start}

/* ---------- header ---------- */
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;row-gap:10px;align-items:center;justify-content:space-between;gap:12px;position:relative}
.logo{display:flex;align-items:center;gap:10px;margin:0;white-space:nowrap;font:600 19px var(--display);letter-spacing:-.015em}
.logo .mark{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:18px var(--suit)}
.top-right{display:flex;align-items:center;gap:8px}
.kpi{display:flex;align-items:baseline;gap:7px;padding:7px 12px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.kpi span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.kpi b{font:600 15px var(--display);font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface);color:var(--text-2);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.icon-btn:hover{color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.menu{position:absolute;right:0;top:48px;z-index:30;width:min(300px,calc(100vw - 32px));background:var(--surface-2);border-radius:16px;padding:16px;box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 0 0 1px var(--line-2);display:grid;gap:14px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;cursor:pointer}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--surface-3);position:relative;cursor:pointer;flex:none;margin:0;transition:background .2s}
.switch input::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--text-2);transition:transform .2s,background .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(16px);background:var(--accent-ink)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px;color:var(--text-2);padding-top:12px;border-top:1px solid var(--line)}
kbd{font:600 11px var(--font);background:var(--surface-3);border-radius:6px;padding:2px 7px;color:var(--text);text-align:center}

/* ---------- table ---------- */
.play{min-width:0}
.table{position:relative;width:100%;aspect-ratio:16/9.6}
.felt{position:absolute;inset:7% 5% 12% 5%;border-radius:999px;
  background:radial-gradient(ellipse 70% 65% at 50% 40%,var(--felt-1),var(--felt-2) 58%,var(--felt-3));
  box-shadow:0 0 0 9px #0c1118,0 0 0 10px rgba(255,255,255,.06),0 34px 80px rgba(0,0,0,.6),inset 0 -24px 60px rgba(0,0,0,.35)}
.felt::after{content:'';position:absolute;inset:18px;border-radius:inherit;border:1px solid rgba(255,255,255,.05)}
.center{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:1;width:66%}
.pot{display:inline-flex;align-items:center;gap:8px;padding:4px 13px 4px 6px;border-radius:999px;background:rgba(0,0,0,.3);font:600 14px var(--display);font-variant-numeric:tabular-nums}
.pot small{font:700 10.5px var(--font);letter-spacing:.14em;color:var(--text-2)}
.pot.empty{visibility:hidden}
.board{display:flex;gap:6px}
.slot{--w:58px;width:var(--w);aspect-ratio:5/7;border-radius:9px;background:rgba(255,255,255,.035)}
.banner{font-size:13.5px;text-align:center;background:rgba(6,9,14,.78);padding:7px 14px;border-radius:12px;max-width:100%;text-wrap:balance}
.banner b{color:var(--accent)}
.chip{width:14px;height:14px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--accent) 0 34%,#fff4d6 35% 46%,var(--accent) 47%);box-shadow:0 1px 3px rgba(0,0,0,.5)}

.seat{position:absolute;transform:translate(-50%,-50%);width:148px;display:flex;flex-direction:column;align-items:center;z-index:2;transition:opacity .25s}
.seat .cards{display:flex;justify-content:center;align-items:flex-start;gap:3px;height:30px;position:relative;z-index:0}
.seat .cards .card{--w:34px}
.plate{position:relative;z-index:1;display:flex;align-items:center;gap:9px;width:100%;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surface);box-shadow:0 8px 20px rgba(0,0,0,.45),inset 0 0 0 1px var(--line-2);transition:box-shadow .25s}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 14px var(--display);color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface-2));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 50%,transparent)}
.meta{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.meta .nm{font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .stk{font:600 14px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.meta .ps{font:800 9.5px var(--font);letter-spacing:.1em;color:var(--accent);margin-left:6px}
.seat.active .plate{box-shadow:0 0 0 2px var(--accent),0 0 28px rgba(245,185,66,.35),0 8px 20px rgba(0,0,0,.45)}
.seat.folded{opacity:.38}
.seat.winner .plate{box-shadow:0 0 0 2px var(--good),0 0 28px rgba(62,207,142,.35)}
.pill{margin-top:6px;height:21px;padding:0 9px;border-radius:999px;font:800 10px var(--font);letter-spacing:.09em;text-transform:uppercase;display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.pill:empty{visibility:hidden}
.pill.hot{background:var(--accent-soft);color:var(--accent)}
.pill.win{background:rgba(62,207,142,.16);color:var(--good)}
.pill.hand{background:rgba(255,255,255,.1);color:var(--text)}
.dots{display:inline-flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

.seat.hero{width:188px}
.seat.hero .cards{height:56px;gap:0}
.seat.hero .cards .card{--w:62px}
.seat.hero .cards .card:first-child{rotate:-5deg;translate:5px 2px}
.seat.hero .cards .card:last-child{rotate:5deg;translate:-5px 2px}
.seat.hero .plate{padding:6px 14px 6px 6px}

.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;font:600 12.5px var(--display);padding:3px 10px 3px 4px;border-radius:999px;background:rgba(0,0,0,.35);z-index:1;font-variant-numeric:tabular-nums}
.dbtn{position:absolute;transform:translate(-50%,-50%);width:21px;height:21px;border-radius:50%;background:#fff;color:#10141a;font:700 10.5px var(--display);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:3;transition:left .4s,top .4s}

.s0{left:50%;top:86%} .s1{left:9%;top:62%} .s2{left:24%;top:12%} .s3{left:76%;top:12%} .s4{left:91%;top:62%}

/* ---------- cards ---------- */
.card{--w:44px;width:var(--w);aspect-ratio:5/7;border-radius:calc(var(--w)*.13);background:var(--card);position:relative;color:var(--sc);flex:none;font-family:var(--display);box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.06);animation:deal .3s ease-out}
.card .r{position:absolute;left:11%;top:5%;font-weight:700;font-size:calc(var(--w)*.4);line-height:1;letter-spacing:-.04em}
.card .cs{position:absolute;left:13%;top:calc(7% + var(--w)*.4);font:calc(var(--w)*.3)/1 var(--suit)}
.card .cb{position:absolute;right:9%;bottom:6%;font:calc(var(--w)*.56)/1 var(--suit)}
.card.sp{--sc:var(--sp)} .card.he{--sc:var(--he)} .card.di{--sc:var(--di)} .card.cl{--sc:var(--cl)}
.card.back{background:repeating-linear-gradient(135deg,rgba(245,185,66,.2) 0 2px,transparent 2px 7px),linear-gradient(160deg,#24446b,#152a44);box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),inset 0 0 0 4px #183150,0 4px 14px rgba(0,0,0,.4)}
.card.dim{filter:brightness(.5) saturate(.5)}
@keyframes deal{from{opacity:0;translate:0 -10px}to{opacity:1}}

/* ---------- toast & dock ---------- */
.toast{margin-top:12px;display:flex;gap:10px;align-items:flex-start;padding:11px 12px 11px 14px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;color:var(--text-2)}
.toast .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--c)}
.toast b{color:var(--text)}
.toast a{color:var(--accent);font-weight:700;text-decoration:none;white-space:nowrap}
.toast .x{margin-left:auto;border:0;background:none;color:var(--text-3);cursor:pointer;font-size:18px;line-height:1;padding:2px 4px}
.toast.good{--c:var(--good)} .toast.ok{--c:var(--warn)} .toast.leak{--c:var(--bad)} .toast.tip{--c:var(--accent)}

.dock{margin-top:12px;background:var(--surface);border-radius:20px;padding:14px;display:grid;gap:12px;box-shadow:inset 0 0 0 1px var(--line)}
.dock-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px}
.status{font-size:14px;color:var(--text-2)}
.status b{color:var(--text);font-weight:700}
.coach-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px 9px 11px;border-radius:999px;border:0;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:14px;cursor:pointer;flex:none;transition:background .15s,opacity .15s}
.coach-btn:hover:not(:disabled){background:rgba(245,185,66,.22)}
.coach-btn:disabled{opacity:.35;cursor:not-allowed}
.coach-btn svg{width:18px;height:18px}
.sizer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:11px;background:var(--bg-2)}
.seg button{border:0;background:transparent;color:var(--text-2);font:700 12.5px var(--font);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button:hover:not(:disabled){color:var(--text)}
.seg button.on{background:var(--surface-3);color:var(--text)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.sizer input[type=range]{flex:1 1 150px;min-width:0;accent-color:var(--accent);margin:0}
.btns{display:grid;grid-template-columns:1fr 1.2fr 1.4fr;gap:10px}
.btn{height:52px;border-radius:14px;border:0;font:800 15px var(--font);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:filter .15s,transform .08s,opacity .15s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.fold{background:var(--surface-2);color:var(--text)}
.btn.call{background:var(--surface-3);color:var(--text)}
.btn.raise,.btn.next{background:var(--accent);color:var(--accent-ink)}
.btn.next{width:100%}

/* ---------- coach panel ---------- */
.coach{background:var(--surface);border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;max-height:calc(100vh - 32px);overflow:hidden}
.tabs{display:flex;gap:2px;margin:12px 12px 4px;padding:3px;border-radius:12px;background:var(--bg-2);flex:none}
.tab{flex:1;border:0;background:transparent;color:var(--text-2);font:700 13px var(--font);padding:8px;border-radius:9px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface-3);color:var(--text)}
.pane{padding:14px 18px 20px;overflow:auto;flex:1;min-height:0}
.stack{display:grid;gap:18px}
.eyebrow{font:800 11px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin:0 0 6px}
.h2{font:600 20px/1.25 var(--display);letter-spacing:-.015em;margin:0 0 6px;text-wrap:balance}
.muted{color:var(--text-2);font-size:14px;margin:0}
.roster{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.roster li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center}
.roster b{font-weight:700;font-size:14px}
.roster .t{font-size:12px;color:var(--text-3);margin-left:6px}
.roster p{margin:1px 0 0;font-size:13px;color:var(--text-2)}
.profile{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini{background:var(--surface-2);border-radius:12px;padding:9px 11px;min-width:0}
.mini .k{font:800 10px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.mini .v{font:600 16px var(--display);margin-top:2px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.mini .v small{font:600 11px var(--font);color:var(--text-3);margin-left:4px}
.note{font-size:13px;color:var(--text-2);margin:8px 0 0}

.tip.stale{opacity:.45}
.stale-note{font-size:13px;color:var(--warn);margin:0}
.verdict{font:700 30px/1.1 var(--display);letter-spacing:-.025em;margin:0}
.verdict.go{color:var(--good)} .verdict.caution{color:var(--warn)} .verdict.stop{color:var(--bad)}
.summary{margin:8px 0 0;font-size:15px;text-wrap:pretty}
.odds,.strength{display:grid;gap:12px;background:var(--surface-2);border-radius:14px;padding:13px 14px}
.odds .eyebrow{margin:0}
.odds-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;color:var(--text-2)}
.odds-top em{font-style:normal;color:var(--text-3);font-size:12px}
.odds-top > b{font:600 16px var(--display);color:var(--text);white-space:nowrap}
.odds-top > b small{font:600 11.5px var(--font);color:var(--text-3);margin-left:6px}
.dots10{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;margin-top:7px}
.dots10 i{justify-self:center;width:100%;max-width:20px;aspect-ratio:1;border-radius:50%;background:linear-gradient(90deg,var(--c) var(--f),var(--surface-3) var(--f))}
.dots10.win{--c:var(--good)} .dots10.need{--c:var(--text-2)}
.odds-say{margin:0;font-size:13.5px;color:var(--text-2);text-wrap:pretty}
.odds-say.good{color:var(--good)} .odds-say.bad{color:var(--bad)} .odds-say.close{color:var(--warn)}
.hand-cls{font:600 14px var(--display);color:var(--text)}
.tiers{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;height:10px}
.tiers span{border-radius:3px}
.tiers .t0,.tier.t0{--t:#f87171} .tiers .t1,.tier.t1{--t:#fb923c} .tiers .t2,.tier.t2{--t:#f5b942} .tiers .t3,.tier.t3{--t:#8fd9a8} .tiers .t4,.tier.t4{--t:#3ecf8e}
.tiers span{background:color-mix(in srgb,var(--t) 65%,transparent)}
.tier{font:700 15px var(--display);color:var(--t)}
.tiers .you{position:absolute;top:-3px;width:16px;height:16px;border-radius:50%;background:#fff;translate:-50% 0;box-shadow:0 0 0 3px var(--surface-2)}
.tiers .cut{position:absolute;top:-7px;bottom:-7px;width:2px;border-radius:1px;background:rgba(255,255,255,.75);translate:-50% 0}
.tier-labels{display:grid;grid-template-columns:repeat(5,1fr);font-size:10.5px;color:var(--text-3);text-align:center;margin-top:-4px}
.gloss{margin:0}
.gloss dt{font-weight:700;font-size:13.5px;margin-top:12px}
.gloss dt:first-child{margin-top:0}
.gloss dd{margin:2px 0 0;font-size:13px;color:var(--text-2);text-wrap:pretty}
.recap{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.recap li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.recap .mk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--font)}
.recap .good .mk{background:rgba(62,207,142,.16);color:var(--good)}
.recap .ok .mk{background:rgba(251,146,60,.16);color:var(--warn)}
.recap .leak .mk{background:rgba(248,113,113,.16);color:var(--bad)}
.recap b{font-size:13.5px;font-weight:700}
.recap p{margin:2px 0 0;font-size:13px;color:var(--text-2);text-wrap:pretty}
.why{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.why li{position:relative;padding-left:16px;font-size:14px;color:var(--text-2);text-wrap:pretty}
.why li::before{content:'';position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
details.fold-out{border-top:1px solid var(--line);padding-top:12px}
details.fold-out summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font:700 13px var(--font);color:var(--text-2)}
details.fold-out summary::-webkit-details-marker{display:none}
details.fold-out summary::after{content:'+';font-size:18px;line-height:1;color:var(--text-3)}
details.fold-out[open] summary::after{content:'–'}
details.fold-out > div{margin-top:12px}
.reads{display:grid;gap:12px}
.read{display:grid;grid-template-columns:34px 1fr;gap:12px}
.read b{font-weight:700;font-size:14px}
.read .w{font:600 12px var(--display);color:var(--accent);margin-left:6px}
.read p{margin:2px 0 0;font-size:13px;color:var(--text-2);text-wrap:pretty}
.lesson{background:var(--accent-soft);border-radius:14px;padding:13px 15px}
.lesson h3{font:600 15px var(--display);margin:0 0 4px;color:var(--accent)}
.lesson p{margin:0;font-size:13.5px;color:var(--text);text-wrap:pretty}

.chart-pos{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--bg-2);margin:12px 0}
.chart-pos button{flex:1;border:0;background:transparent;color:var(--text-2);font:700 12px var(--font);padding:6px 4px;border-radius:8px;cursor:pointer}
.chart-pos button[aria-pressed="true"]{background:var(--surface-3);color:var(--text)}
.grid13{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;font:600 9px var(--display)}
.grid13 div{aspect-ratio:1;display:grid;place-items:center;border-radius:4px;background:var(--surface-2);color:var(--text-3);letter-spacing:-.05em}
.grid13 div.in{background:rgba(245,185,66,var(--a,.8));color:var(--accent-ink)}
.grid13 div.me{outline:2px solid #fff;outline-offset:-1px;position:relative;z-index:1}
.chart-key{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--text-2)}
.chart-key span{display:inline-flex;align-items:center;gap:6px}
.chart-key i{width:12px;height:12px;border-radius:3px;display:inline-block}

.log{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:13px}
.log li{color:var(--text-2);text-wrap:pretty}
.log li.hand{color:var(--text);font:600 14px var(--display);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.log li.hand:first-child{margin-top:0;padding-top:0;border-top:0}
.log li.street{color:var(--text);font-weight:700;font-size:12.5px}
.log li.win{color:var(--good)}
.log li.leak{color:var(--bad)}
.log li.me{color:var(--text)}

/* ---------- responsive ---------- */
@media (max-width:1060px){
