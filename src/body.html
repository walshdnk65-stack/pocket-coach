<div class="app">
  <header class="top">
    <h1 class="logo"><span class="mark" aria-hidden="true">&#x2660;&#xFE0E;</span>Pocket Coach</h1>
    <div class="top-right">
      <div class="kpi hide-sm"><span>Hand</span><b id="kHand">—</b></div>
      <div class="kpi"><span>Stack</span><b id="kStack">2,000</b></div>
      <div class="kpi"><span>Net</span><b id="kNet">0</b></div>
      <button class="icon-btn" id="bMenu" type="button" aria-label="Settings" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
      <div class="menu" id="menu" hidden>
        <label class="switch">Review my decisions as I play <input type="checkbox" id="optAlerts" checked></label>
        <label class="switch">Fast bots <input type="checkbox" id="optFast"></label>
        <div class="keys" aria-label="Keyboard shortcuts">
          <kbd>F</kbd><span>Fold</span>
          <kbd>C</kbd><span>Check or call</span>
          <kbd>R</kbd><span>Bet or raise</span>
          <kbd>T</kbd><span>Ask the coach</span>
          <kbd>N</kbd><span>Next hand</span>
        </div>
      </div>
    </div>
  </header>

  <main class="play">
    <div class="table" id="table">
      <div class="felt"></div>
      <div class="center">
        <div class="pot empty" id="pot"></div>
        <div class="board" id="board"></div>
        <div class="banner" id="banner" hidden></div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <section class="dock" aria-label="Your actions">
      <div class="dock-head">
        <div class="status" id="status" aria-live="polite">Shuffling up…</div>
        <button class="coach-btn" id="bTip" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg>
          Ask the coach
        </button>
      </div>
      <div class="sizer" id="sizer">
        <div class="seg" id="presets" role="group" aria-label="Bet size presets"></div>
        <input type="range" id="rAmt" min="0" max="100" step="5" value="0" aria-label="Bet size">
      </div>
      <div class="btns" id="actBtns">
        <button class="btn fold" id="bFold" type="button">Fold</button>
        <button class="btn call" id="bCall" type="button">Check</button>
        <button class="btn raise" id="bRaise" type="button">Raise</button>
      </div>
      <button class="btn next" id="bNext" type="button" hidden>Next hand</button>
    </section>
  </main>

  <aside class="coach" id="coach" aria-label="Coach">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tCoach" aria-selected="true" aria-controls="paneCoach" type="button">Coach</button>
      <button class="tab" role="tab" id="tChart" aria-selected="false" aria-controls="paneChart" type="button">Hand chart</button>
      <button class="tab" role="tab" id="tLog" aria-selected="false" aria-controls="paneLog" type="button">History</button>
    </div>
    <div class="pane" id="paneCoach" role="tabpanel"></div>
    <div class="pane" id="paneChart" role="tabpanel" hidden></div>
    <div class="pane" id="paneLog" role="tabpanel" hidden><ol class="log" id="log"></ol></div>
  </aside>
</div>
